// ---------------- enemy projectiles ----------------
const EB_R = { eb: 2, orb: 4, gren: 3, spore: 3, missile: 4, bomb: 4 };
function updateEnemyBullets() {
  const cam = G.cam;
  for (const b of G.eb) {
    b.t++;
    if (b.kind === 'blast') { if (--b.life <= 0) b.dead = true; continue; }
    if (b.g) b.vy += b.g;
    if (b.kind === 'missile') {
      if (b.t < 80) {
        const p = nearestPlayer(b.x, b.y);
        if (p) {
          const want = Math.atan2(p.y - 14 - b.y, p.x - b.x), cur = Math.atan2(b.vy, b.vx);
          let d = want - cur; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
          const na = cur + clamp(d, -0.035, 0.035), s = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
        }
      }
      if (b.t % 3 === 0) smoke(b.x - b.vx * 3, b.y - b.vy * 3);
    }
    b.x += b.vx; b.y += b.vy;
    if (b.kind === 'gren' || b.kind === 'bomb' || b.kind === 'spore') {
      const t = tileAtPx(b.x, b.y + 3);
      let hitPlat = false;
      for (const p of L.platforms) if (b.vy > 0 && b.x >= p.x && b.x <= p.x + p.w && b.y + 3 >= p.y && b.y - b.vy <= p.y + 2) hitPlat = true;
      if (b.vy > 0 && (t === T_SOLID || t === T_LEDGE || hitPlat)) {
        b.dead = true;
        if (b.kind === 'spore') { debris(b.x, b.y, 6, ['#9ae04a', '#e8ffb0', '#5a8a2a']); Snd.play('spit'); }
        else { explode(b.x, b.y - 2, 's'); G.eb.push({ kind: 'blast', x: b.x, y: b.y - 6, r: 12, life: 12, t: 0 }); }
      } else if (t === T_WSURF || t === T_WATER) { b.dead = true; splash(b.x, waterLineAt(b.x) || b.y); }
    }
    if (b.x < cam.x - 30 || b.x > cam.x + W + 30 || b.y < cam.y - 60 || b.y > cam.y + H + 30) b.dead = true;
  }
  G.eb = G.eb.filter(b => !b.dead);
}
function ebBox(b) { const r = b.kind === 'blast' ? b.r : EB_R[b.kind] || 2; return [b.x - r, b.y - r, b.x + r, b.y + r]; }
function drawEnemyBullets() {
  for (const b of G.eb) {
    if (b.kind === 'eb') drawSpr(SPR.B.eb, b.x, b.y);
    else if (b.kind === 'orb') drawSpr(SPR.B.orb, b.x, b.y);
    else if (b.kind === 'gren' || b.kind === 'bomb') drawSpr(SPR.B['gren' + ((b.t >> 3) & 1)], b.x, b.y);
    else if (b.kind === 'spore') drawSpr(SPR.B['spore' + ((b.t >> 3) & 1)], b.x, b.y);
    else if (b.kind === 'missile') drawSpr(SPR.B.missile[dir16(b.vx, b.vy)], b.x, b.y);
  }
}

function buildFortressArt() {
  const P = new Painter(144, 224);
  const O = rgb('#0c0b14');
  // stone body
  for (let y = 44; y < 192; y++) for (let x = 12; x < 144; x++) {
    const row = Math.floor((y - 44) / 12), off = (row % 2) * 8;
    const mortar = ((y - 44) % 12 === 0) || ((x - 12 + off) % 16 === 0);
    const n = hash2(Math.floor((x - 12 + off) / 16) + row * 7, row);
    P.set(x, y, rgb(mortar ? '#262830' : n < 0.3 ? '#4e525e' : n < 0.7 ? '#5a5e6a' : '#646874'));
    if (!mortar && (y - 44) % 12 === 1) P.set(x, y, rgb('#767a88'));

class Gunship {
  constructor(x, y) {
    this.x = W + 90; this.y = 60; this.homeY = 58; this.t = 0; this.state = 'idle'; this.dead = false; this.hittable = false; this.contact = false; this.isBoss = true;
    this.facing = -1; this.name = 'ATTACK GUNSHIP';
    const m = bossHpMult();
    this.body = new BossPart(this, 'body', Math.round(80 * m), 10000, () => [this.x - 36, this.y - 16, this.x + 34, this.y + 12]);
    this.pods = [-1, 1].map(s => { const p = new BossPart(this, 'pod', Math.round(14 * m), 1000, () => { const px = this.x + s * 12 * -this.facing - 2; return [px - 9, this.y + 10, px + 9, this.y + 21]; }); p.side = s; p.cool = randi(40, 80); return p; });
    this.art = buildGunshipArt();
    this.cool = { nose: 120, bomb: 170, missile: 260 }; this.bombs = 0; this.dt = 0; this.vx = 0;
  }
  get hpFrac() { return this.body.hp / this.body.maxHp; }
  activate() { this.state = 'enter'; bossWarning(this.name); }
  canHitPart() { return this.state === 'fight'; }
  podPos(p) { return [this.x + p.side * 12 * -this.facing - 2, this.y + 16]; }
  update() {
    this.t++;
    if (this.state === 'idle') return;
    if (this.state === 'enter') {
      this.x = approach(this.x, W / 2 + 60, 1.6); this.y = this.homeY + Math.sin(this.t * 0.05) * 4;
      if (Math.abs(this.x - (W / 2 + 60)) < 1) { this.state = 'fight'; G.ents.push(this.body, ...this.pods); }
      return;
    }
    if (this.state === 'fight') {
      const angry = this.hpFrac < 0.5;
      const tx = W / 2 + Math.sin(this.t * (angry ? 0.016 : 0.012)) * 125;
      const nx = approach(this.x, tx, angry ? 2.2 : 1.6);
      this.vx = nx - this.x; this.x = nx;
      this.y = this.homeY + Math.sin(this.t * 0.031) * 10 + (angry ? Math.sin(this.t * 0.013) * 14 : 0);
      const p = nearestPlayer(this.x, this.y);
      if (p) { if (p.x < this.x - 20) this.facing = -1; else if (p.x > this.x + 20) this.facing = 1; }
      // pods
      for (const pd of this.pods) {
        if (pd.dead || !p) continue;
        if (--pd.cool <= 0) { const [mx, my] = this.podPos(pd); shootAt(mx + this.facing * 8, my, p.x, p.y - 12, 1.9); muzzle(mx + this.facing * 8, my); pd.cool = randi(55, 85) / D().fire; }
      }
      // nose cannon: 3-way
      if (--this.cool.nose <= 0 && p) {
        const mx = this.x + this.facing * 44, my = this.y + 4;
        const a = Math.atan2(p.y - 14 - my, p.x - mx);
        for (const o of [-0.22, 0, 0.22]) G.eb.push({ x: mx, y: my, vx: Math.cos(a + o) * 1.8 * D().bspeed, vy: Math.sin(a + o) * 1.8 * D().bspeed, kind: 'orb', t: 0 });
        muzzle(mx, my); Snd.play('eshot');
        this.cool.nose = randi(120, 160) / D().fire;
      }
      // bombs when above a player
      if (--this.cool.bomb <= 0 && p && Math.abs(p.x - this.x) < 50) { this.bombs = 3; this.cool.bomb = randi(170, 230) / D().fire; }
      if (this.bombs > 0 && this.t % 12 === 0) { this.bombs--; G.eb.push({ x: this.x + rand(-6, 6), y: this.y + 16, vx: this.vx * 0.6, vy: 0.4, kind: 'bomb', g: 0.12, t: 0 }); Snd.play('bounce'); }
      // missiles when damaged
      if (angry && --this.cool.missile <= 0) {
        for (const s of [-1, 1]) G.eb.push({ x: this.x + s * 20, y: this.y + 8, vx: s * 1.2, vy: -1.4, kind: 'missile', t: 0, hp: 1 });
        Snd.play('missile'); this.cool.missile = randi(200, 260) / D().fire;
      }
      if (this.hpFrac < 0.35 && this.t % 9 === 0) smoke(this.x + 20 * -this.facing, this.y - 8);
    } else if (this.state === 'dying') {
      this.dt++;
      this.x += this.facing * -0.6; this.y += 0.25 + this.dt * 0.012;
      if (this.dt % 4 === 0) smoke(this.x + rand(-20, 20), this.y - 6);
      if (this.dt % 7 === 0) explode(this.x + rand(-34, 34), this.y + rand(-14, 14), chance(0.3) ? 'l' : 'm', { silent: this.dt % 14 !== 0 });
      if (this.dt === 150) { explode(this.x, this.y, 'l'); explode(this.x - 20, this.y + 10, 'l', { delay: 6 }); explode(this.x + 20, this.y - 6, 'l', { delay: 12 }); flashScreen(1); shake(12); Snd.play('bigboom'); this.state = 'dead'; }
    } else if (this.state === 'dead') {
      this.dt++;
      if (this.dt === 230) stageCleared();
    }
  }
  onPartDie(part) {
    if (part.name === 'body') {
      this.state = 'dying'; this.dt = 0;
      for (const p of this.pods) if (!p.dead) p.dead = true;
      G.eb = G.eb.filter(b => b.kind === 'blast'); flashScreen(0.7); shake(8); Snd.play('bigboom');
    } else { const [x, y] = this.podPos(part); explode(x, y, 'm'); }
  }
  draw() {
    if (this.state === 'idle' || this.state === 'dead') return;
    const x = Math.round(this.x), y = Math.round(this.y);
    const fl = this.facing > 0;
    const img = fl ? this.art.bodyF : this.art.body;
    const tilt = this.state === 'dying' ? Math.sin(this.dt * 0.3) * 2 : 0;
    ctx.drawImage(img, x - 56 - (fl ? 24 : 0), y - 30 + Math.round(tilt));
    if (this.body.flash > 0) { ctx.globalAlpha = 0.6; ctx.drawImage(whiteOf(img), x - 56 - (fl ? 24 : 0), y - 30); ctx.globalAlpha = 1; }
    // rotors
    const rl = (tick & 1) ? 76 : 58;
    ctx.fillStyle = '#0c0b14'; ctx.fillRect(x - rl + (fl ? 8 : -8) * 0, y - 28, rl * 2, 3);
    ctx.fillStyle = '#9aa2b4'; ctx.fillRect(x - rl + 1, y - 27, rl * 2 - 2, 1);
    const tx = x + (fl ? -66 : 66), ty = y - 12;
    ctx.fillStyle = '#9aa2b4'; if (tick & 2) ctx.fillRect(tx - 1, ty - 8, 2, 16); else ctx.fillRect(tx - 8, ty - 1, 16, 2);
    for (const p of this.pods) {
      if (p.dead) continue;
      const [px, py] = this.podPos(p);
      drawSpr(this.art.pod, px, py, fl, p.flash > 0);
    }
    if (this.state === 'fight' && (tick >> 3) & 1) { ctx.fillStyle = '#ff3a3a'; ctx.fillRect(x + (fl ? -60 : 58), y - 20, 2, 2); }
  }
}

class HiveHeart {
  constructor(x, y) {
    this.x = x; this.y = y; this.t = 0; this.state = 'idle'; this.dead = false; this.hittable = false; this.contact = false; this.isBoss = true;
    this.name = 'THE HIVE HEART';
    const m = bossHpMult();
    this.heart = new BossPart(this, 'heart', Math.round(110 * m), 50000, () => [this.x - 26, this.y - 22, this.x + 26, this.y + 30]);
    this.heart.metal = false;
    this.arms = [-1, 1].map(s => {
      const a = new BossPart(this, 'arm', Math.round(22 * m), 3000, () => { const [tx, ty] = a.tip; return [tx - 8, ty - 8, tx + 8, ty + 8]; });
      a.side = s; a.metal = false; a.tip = [this.x, this.y]; a.pts = []; a.base = [this.x - 18, this.y + s * 34]; a.ph = s > 0 ? 0 : 2;
      return a;
    });
    this.art = buildHeartArt();
    this.cool = { spore: 100, spawn: 180, ring: 200 }; this.dt = 0;
  }
  get hpFrac() { return this.heart.hp / this.heart.maxHp; }
  activate() { this.state = 'fight'; G.ents.push(this.heart, ...this.arms); bossWarning(this.name); Snd.play('roar'); }
  canHitPart() { return this.state === 'fight'; }
  updateArm(a) {
    const p = nearestPlayer(this.x, this.y);
    const n = 10, len = 11;
    let ang = Math.PI + a.side * 0.35 + Math.sin(this.t * 0.03 + a.ph) * 0.35;
    if (p) {
      const want = Math.atan2(p.y - 16 - a.base[1], p.x - a.base[0]);
      let d = want - ang; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      ang += clamp(d, -0.5, 0.5) * (0.5 + 0.5 * Math.sin(this.t * 0.02 + a.ph));
    }
    let x = a.base[0], y = a.base[1];
    a.pts = [];
    for (let i = 0; i < n; i++) {
      const wave = Math.sin(this.t * 0.07 + i * 0.6 + a.ph) * 0.28;
      x += Math.cos(ang + wave) * len; y += Math.sin(ang + wave) * len;
      y = Math.min(y, 196);
      a.pts.push([x, y]);
    }
    a.tip = a.pts[n - 1];
  }
  update() {
    this.t++;
    if (this.state === 'idle') { for (const a of this.arms) this.updateArm(a); return; }
    if (this.state === 'fight') {
      const angry = this.hpFrac < 0.5;
      for (const a of this.arms) {
        if (a.dead) continue;
        this.updateArm(a);
        for (const pl of G.players) {
          const b = pl.box(); if (!b) continue;
          for (let i = 3; i < a.pts.length; i++) { const [sx, sy] = a.pts[i]; if (overlap(b, [sx - 5, sy - 5, sx + 5, sy + 5])) { pl.kill(); break; } }
        }
      }
      const p = nearestPlayer(this.x, this.y);
      if (--this.cool.spore <= 0 && p) {
        const k = angry ? 5 : 3;
        for (let i = 0; i < k; i++) lob(this.x - 20, this.y + 6, p.x + (i - (k - 1) / 2) * 26, p.y - 4, 'spore', 50 + i * 4, 0.12);
        Snd.play('spit'); this.cool.spore = randi(angry ? 80 : 110, angry ? 110 : 150) / D().fire;
      }
      if (--this.cool.spawn <= 0) {
        for (let i = 0; i < (angry ? 3 : 2); i++) { const c = new Crawler(G.cam.x + rand(120, 280), 34, -1); c.vy = 1; G.ents.push(c); }
        this.cool.spawn = randi(200, 280) / D().runners;
      }
      if (angry && --this.cool.ring <= 0) {
        for (let i = 0; i < 10; i++) { const a = Math.PI * 0.5 + i / 9 * Math.PI; G.eb.push({ x: this.x - 10, y: this.y + 4, vx: Math.cos(a) * 1.5 * D().bspeed, vy: Math.sin(a) * 1.5 * D().bspeed, kind: 'orb', t: 0 }); }
        Snd.play('roar'); this.cool.ring = randi(190, 240) / D().fire;
      }
    } else if (this.state === 'dying') {
      this.dt++;
      for (const a of this.arms) if (!a.dead) this.updateArm(a);
      if (this.dt % 4 === 0) explode(this.x + rand(-44, 30), this.y + rand(-60, 60), chance(0.4) ? 'l' : 'm', { silent: this.dt % 12 !== 0, cols: ['#9aff5a', '#d05a7a', '#ffffff', '#ffe45a'] });
      if (this.dt % 30 === 0) { flashScreen(0.5); Snd.play('roar'); }
      shake(3);
      if (this.dt === 200) { flashScreen(1); Snd.play('bigboom'); this.state = 'dead'; }
    } else if (this.state === 'dead') {
      this.dt++;
      if (this.dt === 290) stageCleared();
    }
  }
  onPartDie(part) {
    if (part.name === 'heart') {
      this.state = 'dying'; this.dt = 0;
      for (const a of this.arms) if (!a.dead) { a.dead = true; for (const [x, y] of a.pts) if (chance(0.5)) explode(x, y, 's', { silent: true }); }
      G.eb = G.eb.filter(b => b.kind === 'blast');
      for (const e of G.ents) if (e instanceof Crawler) e.die(null);
      flashScreen(0.8); shake(10); Snd.play('roar');
    } else {
      for (const [x, y] of part.pts) explode(x, y, 's', { silent: true });
      Snd.play('boom');
    }
  }
  draw() {
    if (this.state === 'dead') {
      pdisc(this.x, this.y + 6, 26, '#1a0610'); pdisc(this.x - 3, this.y + 3, 18, '#2a0a18');
      if ((tick >> 3) & 1) { ctx.fillStyle = '#9aff5a'; ctx.fillRect(Math.round(this.x) - 6, Math.round(this.y) + 10, 2, 2); ctx.fillRect(Math.round(this.x) + 8, Math.round(this.y), 2, 2); }
      return;
    }
    const beat = this.t % (this.hpFrac < 0.5 ? 34 : 50);
    const fi = beat < 5 ? 2 : beat < 10 ? 0 : 1;
    const img = this.art.frames[fi];
    ctx.drawImage(img, Math.round(this.x - 48), Math.round(this.y - 46));
    if (this.heart.flash > 0) { ctx.globalAlpha = 0.65; ctx.drawImage(whiteOf(img), Math.round(this.x - 48), Math.round(this.y - 46)); ctx.globalAlpha = 1; }
    // glowing weak spot
    const g = (Math.sin(this.t * 0.2) + 1) / 2;
    ctx.fillStyle = this.hpFrac < 0.5 ? (g > 0.5 ? '#b8ff5a' : '#7ae03a') : (g > 0.5 ? '#ffe45a' : '#ffb040');
    ctx.fillRect(Math.round(this.x) - 5, Math.round(this.y) + 2, 10, 10); ctx.fillRect(Math.round(this.x) - 3, Math.round(this.y), 6, 14);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(this.x) - 3, Math.round(this.y) + 3, 2, 2);
    for (const a of this.arms) {
      if (a.dead || !a.pts.length) continue;
      for (let i = a.pts.length - 2; i >= 0; i--) { const s = this.art.seg[Math.min(3, i >> 2)]; drawSpr(s, a.pts[i][0], a.pts[i][1], false, a.flash > 0); }
      drawSpr(this.art.claw, a.tip[0], a.tip[1], a.tip[0] > this.x, a.flash > 0);
      drawSpr(this.art.seg[0], a.base[0], a.base[1]);
    }
  }
}

// ============================================================
//  Stage designs
//  Jump physics: max rise ~56px (3 tiles = 48px is safe), ~4 tiles across.
// ============================================================
function mapBuilder(w, h) {
  const g = Array.from({ length: h }, () => new Array(w).fill('.'));
  const m = {
    fill(x0, x1, y0, y1, ch) {
      for (let y = Math.max(0, y0); y <= Math.min(h - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(w - 1, x1); x++) g[y][x] = ch;
      return m;
    },
    ground(x0, x1, top) { return m.fill(x0, x1, top, h - 1, '#'); },
    block(x0, x1, y0, y1) { return m.fill(x0, x1, y0, y1, '#'); },
    ledge(x0, x1, row) { return m.fill(x0, x1, row, row, '='); },
    water(x0, x1, surf) { m.fill(x0, x1, surf, surf, '~'); return m.fill(x0, x1, surf + 1, h - 1, 'w'); },
    bridge(x0, x1, row) { return m.fill(x0, x1, row, row, 'b'); },
    put(x, y, ch) { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = ch; return m; },
    rows() { return g.map(r => r.join('')); },
  };
  return m;
}

// ------------------------------------------------------------
//  Stage setup
// ------------------------------------------------------------
function startStage(idx, fromCp) {
  const S = STAGES[idx];
  G.stage = idx; G.stageDef = S;
  L = loadLevel(Object.assign({}, S, { map: S.build(), seed: 100 + idx }));
  if (S.bossSolid) for (const s of L.spawns) if (s.ch === 'X') { setTile(s.tx, s.ty, T_SOLID); L.hideFrom = s.tx; }
  G.bg = BG[S.bg]();
  prerenderLevel();
  G.ents = []; G.pb = []; G.eb = []; G.fx = [];
  G.boss = null; G.banner = null; G.flash = 0; G.cam.shake = 0; G.lockInput = false; G.autoRun = false;
  G.runnerT = 150; G.floaterT = 200; G.clearT = 0;
  let ii = 0;
  for (const s of L.spawns) if (s.ch === 'P' || s.ch === 'K') s.item = S.items[ii++ % S.items.length];
  const cp = fromCp ? G.checkpoint : null;
  if (!fromCp) G.checkpoint = null;
  if (S.scroll === 'h') { G.cam.x = cp ? clamp(cp.x - 60, 0, L.pw - W) : 0; G.cam.y = 0; }
  else { G.cam.x = 0; G.cam.y = cp ? clamp(cp.y - H + 60, 0, L.ph - H) : L.ph - H; }
  // structural entities
  const bridges = L.spawns.filter(s => s.ch === 'b').sort((a, b) => a.ty - b.ty || a.tx - b.tx);
  let grp = null, last = null;
  for (const s of bridges) {
    if (!grp || !last || s.ty !== last.ty || s.tx !== last.tx + 1) { grp = new BridgeGroup(s.tx * TS, s.tx * TS + TS); grp.n = 0; G.ents.push(grp); }
    grp.x1 = s.tx * TS + TS;
    G.ents.push(new BridgeSeg(s.tx * TS, s.ty * TS, grp, grp.n++));
    last = s; s.done = true;
  }
  for (const s of L.spawns) {
    if (s.ch === 'h' || s.ch === 'v') {
      const cfg = (S.movers && S.movers[s.ch]) || (s.ch === 'h' ? [96, 0.018] : [48, 0.022]);
      G.ents.push(new Mover(s.tx * TS - 16, s.ty * TS, s.ch, cfg[0], cfg[1]));
      s.done = true;
    } else if (s.ch === 'X') {
      const boss = S.id === 1 ? new FortressGate(s.tx * TS) : S.id === 2 ? new Gunship(s.x, s.y) : new HiveHeart(s.x, s.y);
      G.boss = boss; G.ents.push(boss); s.done = true;
    } else if (s.ch === '!') s.done = true;
    else if (S.scroll === 'h' ? s.x < G.cam.x - 16 : s.y > G.cam.y + H + 16) s.done = true;
  }
  G.checkpoints = L.spawns.filter(s => s.ch === '!');
  // players
  G.players.forEach((p, i) => {
    if (p.state === 'out') return;
    let x, y;
    if (S.scroll === 'h') { x = G.cam.x + 48 + i * 28; y = G.cam.y + 20; if (!surfacesInColumn(x, 40, H).length) [x, y] = findRespawn(p); }
    else if (!cp) { x = 56 + i * 32; y = 108 * TS; }
    else [x, y] = findRespawn(p);
    const keep = { lives: p.lives, score: p.score, nextLife: p.nextLife, weapon: p.weapon, rapid: p.rapid };
    p.reset(x, y); Object.assign(p, keep);
    p.state = 'alive'; p.inv = 90; p.jumping = S.scroll === 'h' || !!cp; p.airAim = [1, 0];
  });
  Snd.music(S.music);
  G.state = 'play';
}

// ------------------------------------------------------------
//  Spawning
// ------------------------------------------------------------
function activateSpawn(s) {
  s.done = true;
  const th = L.theme, S = G.stageDef;
  const gy = (s.ty + 1) * TS;
  switch (s.ch) {
    case 'T': G.ents.push(new Turret(s.x, s.y, th)); break;
    case 'C': G.ents.push(new Cannon(s.x, gy)); break;
    case 'R': G.ents.push(new Rifleman(s.x, gy, S.soldier)); break;
    case 'H': G.ents.push(new BushSniper(s.x, gy)); break;
    case 'G': G.ents.push(new Grenadier(s.x, gy)); break;
    case 'P': G.ents.push(new Pillbox(s.x, gy, s.item, th)); break;
    case 'D': G.ents.push(new Diver(s.x, s.ty * TS + 4)); break;
    case 'K': G.ents.push(new Capsule(s.y, s.item, 1)); break;
    case 'J': G.ents.push(new FireJet(s.x, gy, -1)); break;
    case 'V': G.ents.push(new FireJet(s.x, s.ty * TS, 1)); break;
    case 'O': G.ents.push(new Drone(chance(0.5) ? G.cam.x - 12 : G.cam.x + W + 12, s.y)); break;
    case 'E': G.ents.push(new EggPod(s.x, gy)); break;
    case 'F': for (let i = 0; i < 3; i++) G.ents.push(new Floater(G.cam.x + W + 16 + i * 22, s.y + rand(-20, 20))); break;
    case 'M': {
      const e = tileAt(s.tx - 1, s.ty) === T_EMPTY ? 'left' : tileAt(s.tx, s.ty + 1) === T_EMPTY ? 'down' : tileAt(s.tx, s.ty - 1) === T_EMPTY ? 'up' : 'right';
      G.ents.push(new Mouth(s.x, s.y, e)); break;
    }
  }
}
function updateSpawns() {
  const c = G.cam, hMode = L.def.scroll === 'h';
  for (const s of L.spawns) {
    if (s.done) continue;
    if (hMode) {
      if (s.x > c.x + W + 24) break;
      if (s.x < c.x - 24) { s.done = true; continue; }
      activateSpawn(s);
    } else {
      if (s.y < c.y - 24) break;
      if (s.y > c.y + H + 24) { s.done = true; continue; }
      activateSpawn(s);
    }
  }
  // checkpoints
  for (const cp of G.checkpoints) {
    if (G.checkpoint === cp) continue;
    const passed = hMode ? c.x + W * 0.5 > cp.x : c.y + H * 0.5 < cp.y;
    if (passed && (!G.checkpoint || (hMode ? cp.x > G.checkpoint.x : cp.y < G.checkpoint.y))) G.checkpoint = cp;
  }
  // soldiers / floaters
  const S = G.stageDef;
  const bossBusy = G.boss && G.boss.state !== 'idle';
  if (!bossBusy && --G.runnerT <= 0) {
    let z = null;
    if (hMode) { const cx = (c.x + W / 2) / TS; z = (S.runners || []).find(r => cx >= r[0] && cx <= r[1]); if (z) { spawnRunner(chance(0.12) ? -1 : 1); if (chance(0.3)) G.runnerBurst = 18; } }
    else { const row = (c.y + H / 2) / TS; z = (S.runners || []).find(r => row >= r[0] && row <= r[1]); if (z) spawnDropper(); }
    G.runnerT = z ? randi(z[2] * 0.7, z[2] * 1.3) / D().runners : 60;
  }
  if (G.runnerBurst > 0 && --G.runnerBurst === 0) spawnRunner(1);
  if (S.floaters && !bossBusy && --G.floaterT <= 0) {
    const cx = (c.x + W / 2) / TS;
    const z = S.floaters.find(r => cx >= r[0] && cx <= r[1]);
    if (z) G.ents.push(new Floater(c.x + W + 14, rand(50, 150)));
    G.floaterT = z ? randi(z[2] * 0.7, z[2] * 1.3) / D().runners : 60;
  }
  // boss activation
  if (G.boss && G.boss.state === 'idle') {
    const reached = hMode ? c.x >= L.pw - W - 1 : c.y <= 40 && G.players.some(p => p.alive && p.y < 15 * TS);
    if (reached) { G.boss.activate(); G.arena = true; }
  }
}
function spawnRunner(side) {
  const c = G.cam;
  const x = side > 0 ? c.x + W + 10 : c.x - 10;
  if (x < 8 || x > L.pw - 8) return;
  const surf = surfacesInColumn(x, c.y + 30, c.y + H);
  if (!surf.length) return;
  G.ents.push(new Runner(x, pick(surf), side > 0 ? -1 : 1, G.stageDef.soldier));
}
function spawnDropper() {
  for (let k = 0; k < 10; k++) {
    const x = randi(40, W - 40);
    if (!surfacesInColumn(x, G.cam.y + 16, G.cam.y + H * 0.6).length) continue;
    if (G.players.some(p => Math.abs(p.x - x) < 40)) continue;
    const r = new Runner(x, G.cam.y - 6, chance(0.5) ? -1 : 1, 'trooper'); G.ents.push(r); return;
  }
}

// ------------------------------------------------------------
//  Camera
// ------------------------------------------------------------
function updateCamera() {
  const c = G.cam, alive = G.players.filter(p => p.alive);
  if (L.def.scroll === 'h') {
    if (G.arena) c.x = approach(c.x, L.pw - W, 2);
    else if (alive.length) {
      const lead = Math.max(...alive.map(p => p.x)), trail = Math.min(...alive.map(p => p.x));
      let target = Math.min(lead - W * 0.42, trail - 10);
      if (target > c.x) c.x = Math.min(target, c.x + 2.6);
    }
    c.x = clamp(c.x, 0, L.pw - W);
  } else {
    if (G.arena) c.y = approach(c.y, 0, 2);
    else if (alive.length) {
      const top = Math.min(...alive.map(p => p.y)), bottom = Math.max(...alive.map(p => p.y));
      let target = Math.max(top - H * 0.52, bottom - H + 12);
      if (target < c.y) c.y = Math.max(target, c.y - 2.6);
    }
    c.y = clamp(c.y, 0, L.ph - H);
  }
  if (c.shake > 0) { c.sx = Math.round(rand(-c.shake, c.shake)); c.sy = Math.round(rand(-c.shake, c.shake)); c.shake = Math.max(0, c.shake - 0.4); }
  else { c.sx = c.sy = 0; }
}

// ------------------------------------------------------------
//  Collisions
// ------------------------------------------------------------
function collide() {
  for (const b of G.pb) {
    if (b.dead) continue;
    const bb = bulletBox(b);
    for (const e of G.ents) {
      if (e.dead || !e.hittable || e.isItem) continue;
      if (b.hit && b.hit.has(e)) continue;
      const box = e.box(); if (!box || !overlap(bb, box)) continue;
      e.hurt(b.dmg, b.owner);
      sparks(b.x, b.y, 3, b.kind === 'L' ? '#7ae8ff' : '#fff2a0');
      if (b.pierce) b.hit.add(e); else { b.dead = true; break; }
    }
    if (b.dead) continue;
    for (const x of G.eb) {
      if (x.dead || (x.kind !== 'missile' && x.kind !== 'spore')) continue;
      if (overlap(bb, ebBox(x))) { x.dead = true; explode(x.x, x.y, 's'); addScore(b.owner, 50); if (!b.pierce) { b.dead = true; break; } }
    }
  }
  for (const p of G.players) {
    const pb = p.box(); if (!pb) continue;
    if (p.inv <= 0) {
      for (const b of G.eb) {
        if (b.dead || p.state !== 'alive') continue;
        if (!overlap(pb, ebBox(b))) continue;
        if (b.kind !== 'blast') b.dead = true;
        if (p.barrier > 0) sparks(b.x, b.y, 3, '#7ae8ff'); else { if (DEBUG) G.lastHit = 'bullet:' + b.kind + (b.src ? ':' + b.src : ''); p.kill(); }
      }
    }
    for (const e of G.ents) {
      if (e.dead || p.state !== 'alive') continue;
      if (e.isItem) { if (overlap(pb, e.box())) { applyItem(p, e); e.dead = true; } continue; }
      if (!e.contact) continue;
      const hb = e.hbox ? e.hbox() : e.box();
      if (!hb || !overlap(pb, hb)) continue;
      if (p.barrier > 0 && e.hittable && !e.isBossPart) { e.hurt(99, p); continue; }
      if (DEBUG) G.lastHit = 'touch:' + e.constructor.name;
      p.kill();
    }
  }
}

// ------------------------------------------------------------
//  Game flow
// ------------------------------------------------------------
function newGame(mode) {
  G.mode = mode; G.players = [new Player(0)]; if (mode === 2) G.players.push(new Player(1));
  G.continuesLeft = D().cont; G.checkpoint = null;
  updateBar();
  startIntro(0, false);
}
function startIntro(idx, fromCp) {
  G.state = 'intro'; G.timer = 0; G.stage = idx; G.introCp = fromCp; G.arena = false;
  Snd.stopMusic();
}
function stageCleared() {
  if (G.state !== 'play') return;
  G.state = 'clear'; G.timer = 0; G.lockInput = true;
  Snd.stopMusic(); Snd.music('clear');
  saveHi();
  G.clearBonus = [];
  for (const p of G.players) if (p.state === 'alive') { addScore(p, 5000); G.clearBonus.push(p); }
  G.eb = [];
}
function checkGameOver() {
  if (G.players.every(p => p.state === 'out')) {
    G.state = 'gameover'; G.timer = 0; G.menuSel = 0; Snd.stopMusic(); Snd.music('gameover');
    saveHi();
  }
}
function saveHi() { if (G.hi > Store.get('hi', 0)) Store.set('hi', G.hi); }
function doContinue() {
  G.continuesLeft--;
  for (const p of G.players) { p.lives = D().lives; p.score = 0; p.nextLife = 20000; p.state = 'alive'; p.weapon = 'N'; p.rapid = false; }
  startIntro(G.stage, true);
}
function toTitle() { saveHi(); G.state = 'title'; G.timer = 0; G.menuSel = G.mode === 2 ? 1 : 0; G.players = []; Snd.music('title'); updateBar(); }

// ------------------------------------------------------------
//  Update per state
// ------------------------------------------------------------
function update() {
  tick++;
  Input.pollMenu(MENU);
  Input.pollPlayers(PADS, G.mode);
  const q = Input.takeQueue();
  if (q.includes('KeyM')) toggleMute();
  if (G.state === 'title') updateTitle(q);
  else if (G.state === 'intro') updateIntro();
  else if (G.state === 'play') updatePlay();
  else if (G.state === 'pause') updatePause();
  else if (G.state === 'clear') updateClear();
  else if (G.state === 'gameover') updateGameOver();
  else if (G.state === 'ending') updateEnding();
  if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.04);
  if (G.toast) { G.toast.t++; if (G.toast.t > 90) G.toast = null; }
}

let konamiIdx = 0;
function updateTitle(q) {
  G.timer++;
  for (const k of q) {
    if (k === KONAMI[konamiIdx]) { konamiIdx++; if (konamiIdx === KONAMI.length) { konamiIdx = 0; G.konami = true; Snd.play('code'); G.toast = { text: '30 LIVES!', t: 0 }; G.menuSel = 0; updateBarFor(1); return; } }
    else konamiIdx = k === KONAMI[0] ? 1 : 0;
  }
  const items = 3;
  if (MENU.hit('up')) { G.menuSel = (G.menuSel + items - 1) % items; Snd.play('select'); }
  if (MENU.hit('down')) { G.menuSel = (G.menuSel + 1) % items; Snd.play('select'); }
  if (G.menuSel === 2 && (MENU.hit('left') || MENU.hit('right') || MENU.hit('ok'))) {
    G.diff = (G.diff + (MENU.hit('left') ? 2 : 1)) % 3; Store.set('diff', G.diff); Snd.play('select'); return;
  }
  if ((G.menuSel === 0 || G.menuSel === 1) && (MENU.hit('left') || MENU.hit('right'))) { G.menuSel = 1 - G.menuSel; Snd.play('select'); updateBarFor(G.menuSel + 1); }
  if (MENU.hit('ok') && G.timer > 20) { Snd.play('confirm'); newGame(G.menuSel === 1 ? 2 : 1); }
  if (MENU.hit('up') || MENU.hit('down')) updateBarFor(G.menuSel === 1 ? 2 : 1);
}
function updateIntro() {
  G.timer++;
  if (G.timer === 1 && G.stage === 0 && !G.introCp) Snd.play('confirm');
  if (G.timer > 150 || (G.timer > 40 && MENU.hit('ok'))) startStage(G.stage, G.introCp);
}
function updatePlay() {
  if (G.players.some(p => p.pad.hit('start')) || MENU.hit('back')) { G.state = 'pause'; G.pauseSel = 0; Snd.pauseMusic(true); Snd.play('pause'); return; }
  for (const e of G.ents) if (e.isPlatform || e.isGroup) e.update();
  L.platforms = G.ents.filter(e => e.isPlatform && !e.dead);
  for (const p of G.players) p.update();
  updateCamera();
  updateSpawns();
  for (const e of G.ents) if (!e.isPlatform && !e.isGroup && !e.dead) e.update();
  updatePlayerBullets();
  updateEnemyBullets();
  collide();
  updateFx();
  for (const e of G.ents) if (e.static && !e.dead && behindCamera(e, 100)) e.dead = true;
  G.ents = G.ents.filter(e => !e.dead);
  if (G.banner && ++G.banner.t > G.banner.life) G.banner = null;
}
function updatePause() {
  if (MENU.hit('up') || MENU.hit('down')) { G.pauseSel = 1 - G.pauseSel; Snd.play('select'); }
  const resume = G.players.some(p => p.pad.hit('start')) || (MENU.hit('ok') && G.pauseSel === 0) || MENU.hit('back');
  if (MENU.hit('ok') && G.pauseSel === 1) { Snd.play('confirm'); toTitle(); return; }
  if (resume) { G.state = 'play'; Snd.pauseMusic(false); Snd.play('pause'); }
}
function updateClear() {
  G.timer++;
  for (const e of G.ents) if (e.isPlatform || e.isGroup) e.update();
  L.platforms = G.ents.filter(e => e.isPlatform && !e.dead);
  for (const p of G.players) if (p.state === 'alive') p.update();
  for (const e of G.ents) if (!e.isPlatform && !e.isGroup && !e.dead) e.update();
  updatePlayerBullets(); updateFx();
  G.ents = G.ents.filter(e => !e.dead);
  if (G.timer > 330) {
    G.autoRun = false;
    for (const p of G.players) if (p.state === 'dead') { p.state = p.lives > 0 ? 'alive' : 'out'; }
    G.checkpoint = null;
    if (G.stage + 1 < STAGES.length) startIntro(G.stage + 1, false);
    else { G.state = 'ending'; G.timer = 0; Snd.music('ending'); saveHi(); }
  }
}
function updateGameOver() {
  G.timer++;
  const canCont = G.continuesLeft > 0;
  if (canCont && (MENU.hit('up') || MENU.hit('down'))) { G.menuSel = 1 - G.menuSel; Snd.play('select'); }
  if (G.timer > 60 && MENU.hit('ok')) {
    Snd.play('confirm');
    if (canCont && G.menuSel === 0) doContinue(); else toTitle();
  }
}
function updateEnding() {
  G.timer++;
  if (G.timer > 420 && MENU.hit('ok')) toTitle();
}

const COL = { p1: '#7aa2ff', p2: '#ff8a72', gold: '#ffd23a', text: '#ece4cc', dim: '#8a8ea0', warn: '#ff4a3a' };
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.state === 'title' || G.state === 'boot') renderTitle();
  else if (G.state === 'intro') renderIntro();
  else if (G.state === 'ending') renderEnding();
  else {
    renderWorld();
    renderHUD();
    if (G.state === 'pause') renderPause();
    else if (G.state === 'clear') renderClear();

  }
  if (G.toast) drawText(G.toast.text, W / 2, H - 24, '#7aff9a', { align: 'center', outline: '#0c0b14' });
  if (!Snd.ready && G.state !== 'boot' && (tick >> 5) & 1) drawText('CLICK OR PRESS A KEY FOR SOUND', W / 2, H - 10, COL.dim, { align: 'center', outline: '#0c0b14' });
}
function renderWorld() {
  const c = G.cam;
  G.bg.draw(c.x, c.y);
  ctx.save();
  ctx.translate(-Math.round(c.x) + c.sx, -Math.round(c.y) + c.sy);
  drawLevelTiles(c.x, c.y);
  drawWater(c.x, c.y, false);
  for (const e of G.ents) if (e.isBoss) e.draw();
  for (const e of G.ents) if (e.isPlatform) e.draw();
  for (const e of G.ents) if (!e.isPlatform && !e.isBoss && !e.isItem) e.draw();
  for (const e of G.ents) if (e.isItem) e.draw();
  for (const p of G.players) p.draw();
  drawPlayerBullets();
  drawEnemyBullets();
  drawFx();
  drawWater(c.x, c.y, true);
  ctx.restore();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash); ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function fmtScore(n) { return String(n).padStart(7, '0'); }
function renderHUD() {

  drawPanel(100, 46, 200, 132);
  drawText('PAUSED', W / 2, 56, '#ffffff', { align: 'center', scale: 2 });
  menuLine('RESUME', 150, 82, G.pauseSel === 0);
  menuLine('QUIT TO TITLE', 150, 96, G.pauseSel === 1);
  const ct = controlsText(G.mode);
  ct.forEach(([tag, line], i) => {
    if (tag) drawText(tag, 110, 118 + i * 10, tag === '1P' ? COL.p1 : COL.p2);
    drawText(line, tag ? 128 : W / 2, 118 + i * 10, COL.dim, { align: tag ? 'left' : 'center' });
  });
  drawText('M  SOUND ' + (Snd.muted ? 'OFF' : 'ON'), W / 2, 158, COL.dim, { align: 'center' });
  if (!hasFocus() && !Input.touchMode) clickToPlay();
}
function renderClear() {
  if (G.timer < 40) return;
  drawPanel(110, 70, 180, 70);
  drawText('STAGE CLEAR!', W / 2, 80, COL.gold, { align: 'center', scale: 2 });
  if (G.timer > 90) G.clearBonus.forEach((p, i) => drawText((p.idx ? '2P' : '1P') + ' BONUS  5000', W / 2, 104 + i * 12, p.idx ? COL.p2 : COL.p1, { align: 'center' }));
}
function renderGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.7, G.timer / 60) + ')'; ctx.fillRect(0, 0, W, H);
  if (G.timer < 30) return;
  drawText('GAME OVER', W / 2, 70, COL.warn, { align: 'center', scale: 2, outline: '#1a0000' });
  if (G.continuesLeft > 0) {
    menuLine('CONTINUE' + (G.continuesLeft < 50 ? '  (' + G.continuesLeft + ' LEFT)' : ''), 140, 110, G.menuSel === 0);
    menuLine('END', 140, 124, G.menuSel === 1);
  } else drawText('PRESS ENTER', W / 2, 116, COL.text, { align: 'center' });
}
function renderEnding() {
  const t = G.timer;
  // dawn sky over the sea
  const grad = ctx.createLinearGradient(0, 0, 0, 160);
  grad.addColorStop(0, '#141c46'); grad.addColorStop(0.6, '#d8706a'); grad.addColorStop(1, '#ffc88a');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 160);
  pdisc(96, 160, 26, '#fff0c0'); pdisc(96, 160, 20, '#ffd89a');
  ctx.fillStyle = '#243f7c'; ctx.fillRect(0, 160, W, 64);
  for (let i = 0; i < 24; i++) { ctx.fillStyle = i % 3 ? '#4a6aac' : '#f0b890'; ctx.fillRect((i * 53 + t * 0.4) % (W + 20) - 10, 164 + (i * 7) % 56, 6 + (i % 3) * 3, 1); }
  // the hive island: intact, then gone in a blast
  const sink = t < 250 ? 0 : Math.min(60, (t - 250) * 0.5);
  if (sink < 60) {
    ctx.fillStyle = '#1a1420';
    ctx.beginPath(); ctx.moveTo(230, 161 + sink); ctx.lineTo(262, 128 + sink); ctx.lineTo(296, 136 + sink); ctx.lineTo(330, 104 + sink); ctx.lineTo(356, 122 + sink); ctx.lineTo(392, 161 + sink); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#243f7c'; ctx.fillRect(220, 161, 180, 63);
  }
  if (t < 250 && t % 8 === 0) G.fx.push({ k: 'ex', x: 240 + Math.random() * 140, y: 110 + Math.random() * 45, fr: SPR.ex[chance(0.3) ? 'l' : 'm'], t: 0, rate: 4, delay: 0 });
  if (t === 250) { flashScreen(1); Snd.play('bigboom'); }
  if (t > 250 && t < 760) {
    const k = (t - 250) / 510, top = 150 - k * 70, r = 14 + k * 26;
    ctx.globalAlpha = Math.max(0, 0.9 - k);
    ctx.fillStyle = '#5a4a5a'; ctx.fillRect(304 - Math.round(k * 4), Math.round(top), 12 + Math.round(k * 8), Math.round(161 - top));
    for (const [dx, dy, rr, c] of [[-r * 0.7, 4, 0.7, '#4a3c4c'], [r * 0.7, 4, 0.7, '#4a3c4c'], [0, 0, 1, '#6a5a6a'], [-r * 0.3, -r * 0.35, 0.6, '#8a7a84']]) pdisc(310 + dx, top + dy, r * rr, c);
    ctx.globalAlpha = 1;
  }
  updateFx(); drawFx();
  // rescue chopper carrying the commandos away
  const hx = 250 - t * 0.7, hy = 70 + Math.sin(t * 0.05) * 4;
  if (hx > -90) {
    ctx.fillStyle = '#20242e';
    ctx.fillRect(hx - 18, hy - 6, 36, 12); ctx.fillRect(hx + 18, hy - 3, 26, 4); ctx.fillRect(hx + 40, hy - 9, 4, 11);
    ctx.fillRect(hx - (t & 1 ? 24 : 30), hy - 10, t & 1 ? 48 : 60, 2); ctx.fillRect(hx - 1, hy - 9, 2, 3);
    ctx.fillRect(hx - 12, hy + 9, 26, 1); ctx.fillRect(hx - 8, hy + 6, 1, 3); ctx.fillRect(hx + 8, hy + 6, 1, 3);
    ctx.fillStyle = '#6ad0ff'; ctx.fillRect(hx - 16, hy - 4, 8, 5);
    ctx.fillStyle = '#ea3b2a'; ctx.fillRect(hx - 3, hy - 3, 3, 3);
    if (G.mode === 2) { ctx.fillStyle = '#f5c431'; ctx.fillRect(hx + 2, hy - 3, 3, 3); }
  }
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (t > 120) drawText('MISSION COMPLETE', W / 2, 18, '#ffffff', { align: 'center', scale: 2, outline: '#1a1030' });
  const lines = [['THE HIVE HEART IS DESTROYED.', '#ffffff'], ['THE ALIEN FRONT HAS FALLEN.', '#ffffff'], ['', '']];
  G.players.forEach((p, i) => lines.push([(i ? '2P  ' : '1P  ') + fmtScore(p.score), i ? COL.p2 : COL.p1]));
  lines.push(['', ''], ['THANK YOU FOR PLAYING', COL.gold]);
  lines.forEach(([ln, col], i) => { if (ln && t > 300 + i * 20) drawText(ln, W / 2, 50 + i * 11, col, { align: 'center', outline: '#1a1030' }); });
  if (t > 420 && (t >> 5) & 1) drawText('PRESS ENTER', W / 2, H - 16, '#ffffff', { align: 'center', outline: '#1a1030' });
}

// ------------------------------------------------------------
//  Page chrome: control bar, mute, fullscreen
// ------------------------------------------------------------
function kbd(k) { return `<kbd>${k}</kbd>`; }
function updateBarFor(mode) {
  const bar = document.getElementById('bar');
  let html = '';
  if (mode === 2) {
    html += `<span class="grp"><span class="tag">1P</span>${kbd('W')}${kbd('A')}${kbd('S')}${kbd('D')} ${kbd('F')} fire ${kbd('G')} jump</span>`;
    html += `<span class="grp"><span class="tag">2P</span>${kbd('↑')}${kbd('←')}${kbd('↓')}${kbd('→')} ${kbd('K')} fire ${kbd('L')} jump</span>`;
  } else {
    html += `<span class="grp">${kbd('←')}${kbd('↑')}${kbd('↓')}${kbd('→')} move / aim</span>`;
    html += `<span class="grp">${kbd('Z')} fire</span><span class="grp">${kbd('X')} jump</span>`;
  }
  html += `<span class="grp">${kbd('Enter')} pause</span>`;
  html += `<button id="btnMute" type="button">${Snd.muted ? 'Sound off' : 'Sound on'}</button>`;
  html += `<button id="btnFull" type="button">Fullscreen</button>`;
  bar.innerHTML = html;
  document.getElementById('btnMute').onclick = e => { toggleMute(); e.currentTarget.blur(); canvas.focus(); };
  document.getElementById('btnFull').onclick = e => {
    e.currentTarget.blur();
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (err) { /* fullscreen unavailable */ }
    canvas.focus();
  };
  fitCanvas();
}
function updateBar() { updateBarFor(G.state === 'title' ? (G.menuSel === 1 ? 2 : 1) : G.mode); }
function toggleMute() {
  Snd.setMuted(!Snd.muted);
  G.toast = { text: Snd.muted ? 'SOUND OFF' : 'SOUND ON', t: 0 };
  const b = document.getElementById('btnMute'); if (b) b.textContent = Snd.muted ? 'Sound off' : 'Sound on';
}

// ------------------------------------------------------------
//  Boot
// ------------------------------------------------------------
function boot(data) {
  buildAllSprites();
  G.hi = Math.max(Store.get('hi', 20000), 20000);
  G.diff = clamp(Store.get('diff', 1) | 0, 0, 2);
  G.menuSel = 0;
  G.state = 'title';
  updateBar();
  Snd.music('title');
  const autoPause = () => { if (G.state === 'play') { G.state = 'pause'; G.pauseSel = 0; Snd.pauseMusic(true); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { autoPause(); saveHi(); } });
  window.addEventListener('blur', autoPause);
  Input.onMute = toggleMute;
  document.addEventListener('fullscreenchange', fitCanvas);
  if (data && data.stage !== undefined && data.mode) {
    G.diff = data.diff || 1; G.mode = data.mode;
    G.players = [new Player(0)]; if (data.mode === 2) G.players.push(new Player(1));
    (data.players || []).forEach((s, i) => { if (G.players[i]) Object.assign(G.players[i], { lives: Math.max(1, s.lives), score: s.score }); });
    G.continuesLeft = D().cont;
    startIntro(data.stage, false);
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => (G.players.length && G.state !== 'title' ? { stage: G.stage, mode: G.mode, diff: G.diff, players: G.players.map(p => ({ lives: p.lives, score: p.score })) } : {})); } catch (e) { /* ignore */ }
  }
  fitCanvas();
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = now - last; last = now;
    if (dt > 250) dt = 250;
    acc += dt;
    let n = 0;
    while (acc >= STEP_MS && n < 5) { update(); acc -= STEP_MS; n++; }
    if (n === 5) acc = 0;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (DEBUG) window.__G = { G, get L() { return L; }, startStage, newGame, startIntro, STAGES, PADS, Snd, SPR, keys: Input._keys,
    step(n) { for (let i = 0; i < n; i++) update(); render(); }, render, Player, updateCamera };
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();

</script>
