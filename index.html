<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counterforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root {
    --bg: #07080b;
    --bezel: #13151c;
    --edge: #262a36;
    --ink: #ece4cc;
    --dim: #868a99;
    --hot: #ff5b2e;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 35%, #141722 0%, var(--bg) 70%);
    color: var(--ink);
    font: 12px/1.4 "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
  }
  #screen {
    display: block;
    width: 800px; height: 448px;
    max-width: 100%;
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    box-shadow: 0 0 0 1px var(--edge), 0 0 0 6px var(--bezel), 0 0 0 7px var(--edge), 0 24px 70px rgba(0,0,0,.65);
    border-radius: 2px;
    touch-action: none;
  }
  #screen:focus-visible { box-shadow: 0 0 0 1px var(--hot), 0 0 0 6px var(--bezel), 0 0 0 7px var(--hot), 0 24px 70px rgba(0,0,0,.65); }
  #bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 18px;
    max-width: 100%;
    color: var(--dim);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  #bar .grp { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  #bar .tag { color: var(--hot); }
  kbd {
    display: inline-block; min-width: 1.4em; text-align: center;
    padding: 1px 5px; border-radius: 3px;
    background: var(--bezel); border: 1px solid var(--edge); border-bottom-width: 2px;
    color: var(--ink); font: inherit; font-size: 11px;
  }
  #bar button {
    font: inherit; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); background: var(--bezel);
    border: 1px solid var(--edge); border-radius: 3px; padding: 3px 8px; cursor: pointer;
  }
  #bar button:hover { border-color: var(--dim); }
  #bar button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

  /* Touch controls (shown only after a touch) */
  #touch { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; z-index: 5; }
  #touch .pad, #touch .btn {
    position: fixed; pointer-events: auto; touch-action: none;
    background: rgba(236,228,204,.08); border: 2px solid rgba(236,228,204,.28);
    color: rgba(236,228,204,.8);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: .08em;
  }
  #touch .pad {
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 132px; height: 132px; border-radius: 50%;
  }
  #touch .pad i {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(236,228,204,.22); left: 44px; top: 44px; transition: transform .04s;
  }
  #touch .btn { width: 66px; height: 66px; border-radius: 50%; }
  #touch .fire { right: calc(94px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); border-color: rgba(255,91,46,.6); }
  #touch .jump { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
  #touch .start { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 64px; height: 30px; border-radius: 15px; font-size: 10px; }
  #touch .mute { right: calc(92px + env(safe-area-inset-right, 0px)); }
  #touch .btn.on, #touch .pad.on { background: rgba(236,228,204,.2); }
  body.touch #bar { display: none; }
  @media (prefers-reduced-motion: reduce) { #touch .pad i { transition: none; } }
</style>

</head>
<body>
<div id="app">
  <canvas id="screen" width="400" height="224" tabindex="0" aria-label="Counterforce game screen. Press Enter to start."></canvas>
  <div id="bar" aria-live="polite"></div>
</div>

<div id="touch" hidden>
  <div class="pad" id="tPad"><i id="tKnob"></i></div>
  <div class="btn fire" id="tFire">FIRE</div>
  <div class="btn jump" id="tJump">JUMP</div>
  <div class="btn start" id="tStart">PAUSE</div>
  <div class="btn start mute" id="tMute">SOUND</div>
</div>

<script>
(() => {
'use strict';
// ============================================================
//  COUNTERFORCE — core constants & helpers
// ============================================================
const W = 400, H = 224, TS = 16;
const STEP_MS = 1000 / 60;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const DEBUG = /[?&]debug/.test(location.search);

let tick = 0; // global frame counter (60 per second)

function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function chance(p) { return Math.random() < p; }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; }
function lerp(a, b, t) { return a + (b - a) * t; }
function approach(v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); }
function hypot(x, y) { return Math.sqrt(x * x + y * y); }
function overlap(a, b) { return a && b && a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]; }
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// angle helpers: 16-direction index <-> vector (0 = right, clockwise, screen y down)
function dir16(dx, dy) { let a = Math.atan2(dy, dx); if (a < 0) a += Math.PI * 2; return Math.round(a / (Math.PI / 8)) % 16; }
function vec16(i) { const a = i * Math.PI / 8; return [Math.cos(a), Math.sin(a)]; }

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- store (per-viewer conveniences only) ----------
const Store = {
  get(k, d) { try { const v = localStorage.getItem('cf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cf_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// ---------- canvas fitting ----------
function fitCanvas() {
  const app = document.getElementById('app');
  const bar = document.getElementById('bar');
  const touchOn = document.body.classList.contains('touch');
  const cs = getComputedStyle(app);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const barH = touchOn ? 0 : bar.offsetHeight + 12;
  let availW = app.clientWidth - padX - 14;
  let availH = app.clientHeight - padY - barH - 14;
  const portrait = window.innerHeight > window.innerWidth;
  if (touchOn && portrait) availH = Math.min(availH, window.innerHeight * 0.55);
  if (touchOn && !portrait) availW = Math.min(availW, window.innerWidth - 2 * 150);
  let s = Math.min(availW / W, availH / H);
  if (s >= 1) { const si = Math.floor(s); if (si / s > 0.84) s = si; }
  s = Math.max(0.5, s);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

// ============================================================
//  5x7 bitmap font
// ============================================================
const GLYPHS = {
  'A': [14, 17, 17, 31, 17, 17, 17], 'B': [30, 17, 17, 30, 17, 17, 30], 'C': [14, 17, 16, 16, 16, 17, 14],
  'D': [30, 17, 17, 17, 17, 17, 30], 'E': [31, 16, 16, 30, 16, 16, 31], 'F': [31, 16, 16, 30, 16, 16, 16],
  'G': [14, 17, 16, 23, 17, 17, 15], 'H': [17, 17, 17, 31, 17, 17, 17], 'I': [14, 4, 4, 4, 4, 4, 14],
  'J': [7, 2, 2, 2, 2, 18, 12], 'K': [17, 18, 20, 24, 20, 18, 17], 'L': [16, 16, 16, 16, 16, 16, 31],
  'M': [17, 27, 21, 21, 17, 17, 17], 'N': [17, 17, 25, 21, 19, 17, 17], 'O': [14, 17, 17, 17, 17, 17, 14],
  'P': [30, 17, 17, 30, 16, 16, 16], 'Q': [14, 17, 17, 17, 21, 18, 13], 'R': [30, 17, 17, 30, 20, 18, 17],
  'S': [15, 16, 16, 14, 1, 1, 30], 'T': [31, 4, 4, 4, 4, 4, 4], 'U': [17, 17, 17, 17, 17, 17, 14],
  'V': [17, 17, 17, 17, 17, 10, 4], 'W': [17, 17, 17, 21, 21, 21, 10], 'X': [17, 17, 10, 4, 10, 17, 17],
  'Y': [17, 17, 10, 4, 4, 4, 4], 'Z': [31, 1, 2, 4, 8, 16, 31],
  '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31],
  '3': [14, 17, 1, 6, 1, 17, 14], '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14],
  '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8], '8': [14, 17, 17, 14, 17, 17, 14],
  '9': [14, 17, 17, 15, 1, 2, 12],
  '.': [0, 0, 0, 0, 0, 12, 12], ',': [0, 0, 0, 0, 12, 4, 8], ':': [0, 12, 12, 0, 12, 12, 0],
  '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4], '-': [0, 0, 0, 14, 0, 0, 0],
  '+': [0, 4, 4, 31, 4, 4, 0], '/': [1, 2, 2, 4, 8, 8, 16], "'": [4, 4, 8, 0, 0, 0, 0],
  '(': [2, 4, 8, 8, 8, 4, 2], ')': [8, 4, 2, 2, 2, 4, 8], '%': [25, 25, 2, 4, 8, 19, 19],
  '>': [8, 4, 2, 1, 2, 4, 8], '<': [2, 4, 8, 16, 8, 4, 2], '"': [10, 10, 0, 0, 0, 0, 0],
  '*': [0, 21, 14, 31, 14, 21, 0], '=': [0, 0, 31, 0, 31, 0, 0], '#': [10, 31, 10, 10, 10, 31, 10],
  '↑': [4, 14, 21, 4, 4, 4, 4], '↓': [4, 4, 4, 4, 21, 14, 4], '←': [0, 4, 8, 31, 8, 4, 0], '→': [0, 4, 2, 31, 2, 4, 0],
  '·': [0, 0, 0, 12, 12, 0, 0], '_': [0, 0, 0, 0, 0, 0, 31], '×': [0, 0, 17, 10, 4, 10, 17],
  '♥': [0, 10, 31, 31, 14, 4, 0], '★': [4, 4, 31, 14, 14, 27, 17],
};
const FONT_CHARS = Object.keys(GLYPHS);
const FONT_INDEX = {}; FONT_CHARS.forEach((c, i) => FONT_INDEX[c] = i);
const FONT_ATLAS = (() => {
  const c = makeCanvas(FONT_CHARS.length * 6, 7);
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  FONT_CHARS.forEach((ch, i) => {
    const rows = GLYPHS[ch];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y] & (16 >> x)) g.fillRect(i * 6 + x, y, 1, 1);
  });
  return c;
})();
const fontCache = {};
function fontFor(color) {
  let c = fontCache[color];
  if (!c) {
    c = makeCanvas(FONT_ATLAS.width, 7);
    const g = c.getContext('2d');
    g.drawImage(FONT_ATLAS, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color; g.fillRect(0, 0, c.width, 7);
    fontCache[color] = c;
  }
  return c;
}
function textWidth(str, scale = 1) { return str.length ? (str.length * 6 - 1) * scale : 0; }
function mapChar(ch) {
  if (FONT_INDEX[ch] !== undefined) return FONT_INDEX[ch];
  const u = ch.toUpperCase();
  return FONT_INDEX[u] !== undefined ? FONT_INDEX[u] : -1;
}
function rawText(g, str, x, y, color, scale) {
  const atlas = fontFor(color);
  for (let i = 0; i < str.length; i++) {
    const idx = mapChar(str[i]);
    if (idx >= 0) g.drawImage(atlas, idx * 6, 0, 5, 7, x + i * 6 * scale, y, 5 * scale, 7 * scale);
  }
}
// drawText(str, x, y, color, {align, shadow, outline, scale, g})
function drawText(str, x, y, color = '#fff', o = {}) {
  str = String(str);
  const g = o.g || ctx, scale = o.scale || 1;
  const w = textWidth(str, scale);
  if (o.align === 'center') x -= Math.floor(w / 2); else if (o.align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (o.outline) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) rawText(g, str, x + dx * scale, y + dy * scale, o.outline, scale);
  } else if (o.shadow) rawText(g, str, x + scale, y + scale, o.shadow, scale);
  rawText(g, str, x, y, color, scale);
  return w;
}

// Big logo text: chunky letters with a vertical metal-fire gradient, outline and drop shadow.
function renderLogo(str, scale, ramp) {
  const w = textWidth(str, scale) + scale * 4 + 4, h = 7 * scale + scale * 4 + 4;
  const P = new Painter(w, h);
  const ox = scale * 2, oy = scale * 2;
  const OUT = rgb('#0a0a10'), SHADOW = rgb('#3a0d12');
  const pix = [];
  for (let i = 0; i < str.length; i++) {
    const idx = mapChar(str[i]); if (idx < 0) continue;
    const rows = GLYPHS[FONT_CHARS[idx]];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y] & (16 >> x)) pix.push([ox + (i * 6 + x) * scale, oy + y * scale]);
  }
  // drop shadow
  for (const [px, py] of pix) P.rect(px + scale, py + scale + 1, scale, scale, SHADOW);
  // body with gradient by row inside each letter pixel row
  for (const [px, py] of pix) {
    for (let j = 0; j < scale; j++) {
      const t = ((py - oy) + j) / (7 * scale);
      const c = ramp[Math.min(ramp.length - 1, Math.floor(t * ramp.length))];
      P.rect(px, py + j, scale, 1, rgb(c));
    }
  }
  // bevel highlight on top-left of each pixel block
  const set = new Set(pix.map(p => p[0] + ',' + p[1]));
  for (const [px, py] of pix) {
    if (!set.has(px + ',' + (py - scale))) P.rect(px, py, scale, 1, rgb('#fff6d8'));
    if (!set.has((px - scale) + ',' + py)) P.rect(px, py, 1, scale, rgb('#fff0c0'));
  }
  P.outline(OUT, true);
  return P.toCanvas();
}

// ============================================================
//  Pixel painter + sprite helpers
// ============================================================
const _rgbCache = {};
// '#rrggbb' -> packed ABGR (little-endian ImageData order)
function rgb(hex, a = 255) {
  const key = hex + a;
  let v = _rgbCache[key];
  if (v === undefined) {
    const n = parseInt(hex.slice(1), 16);
    v = ((a << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0;
    _rgbCache[key] = v;
  }
  return v;
}
function shade(hex, f) { // f<1 darker, f>1 lighter (towards white)
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f <= 1) { r *= f; g *= f; b *= f; } else { const t = f - 1; r += (255 - r) * t; g += (255 - g) * t; b += (255 - b) * t; }
  const h = x => ('0' + Math.round(clamp(x, 0, 255)).toString(16)).slice(-2);
  return '#' + h(r) + h(g) + h(b);
}
function mix(a, b, t) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((na >> s) & 255) * (1 - t) + ((nb >> s) & 255) * t);
  const h = x => ('0' + x.toString(16)).slice(-2);
  return '#' + h(ch(16)) + h(ch(8)) + h(ch(0));
}

class Painter {
  constructor(w, h) { this.w = w; this.h = h; this.buf = new Uint32Array(w * h); }
  set(x, y, c) {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.buf[y * this.w + x] = c;
  }
  get(x, y) { return (x >= 0 && y >= 0 && x < this.w && y < this.h) ? this.buf[y * this.w + x] : 0; }
  rect(x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
  }
  stamp(x, y, c, t) { const o = Math.floor((t - 1) / 2); this.rect(Math.round(x) - o, Math.round(y) - o, t, t, c); }
  line(x0, y0, x1, y1, c, t = 1) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy), 1);
    for (let i = 0; i <= n; i++) this.stamp(x0 + dx * i / n, y0 + dy * i / n, c, t);
  }
  disc(cx, cy, r, c) {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) this.set(cx + x, cy + y, c);
  }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx + 0.01) + (y * y) / (ry * ry + 0.01) <= 1.05) this.set(cx + x, cy + y, c);
    }
  }
  ring(cx, cy, r, c) {
    for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
      const d = Math.sqrt(x * x + y * y); if (d > r - 0.7 && d <= r + 0.3) this.set(cx + x, cy + y, c);
    }
  }
  poly(pts, c) { // filled polygon (even-odd), pts = [[x,y],...]
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
      const px = x + 0.5, py = y + 0.5; let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
      }
      if (inside) this.set(x, y, c);
    }
  }
  // 1px outline around all opaque pixels (4-neighbour, optionally 8)
  outline(c, diag = false) {
    const src = this.buf.slice(), w = this.w, h = this.h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      let hit = false;
      for (let k = 0; k < (diag ? 8 : 4) && !hit; k++) {
        const nx = x + [1, -1, 0, 0, 1, 1, -1, -1][k], ny = y + [0, 0, 1, -1, 1, -1, 1, -1][k];
        if (nx >= 0 && ny >= 0 && nx < w && ny < h && src[ny * w + nx]) hit = true;
      }
      if (hit) this.buf[y * w + x] = c;
    }
  }
  // replace colour a by b
  swap(a, b) { for (let i = 0; i < this.buf.length; i++) if (this.buf[i] === a) this.buf[i] = b; }
  toCanvas() {
    const c = makeCanvas(this.w, this.h);
    const g = c.getContext('2d');
    const id = g.createImageData(this.w, this.h);
    new Uint32Array(id.data.buffer).set(this.buf);
    g.putImageData(id, 0, 0);
    return c;
  }
}

function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function tintCanvas(src, color) {
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
const _whiteCache = new WeakMap();
function whiteOf(img) { let w = _whiteCache.get(img); if (!w) { w = tintCanvas(img, '#ffffff'); _whiteCache.set(img, w); } return w; }
// crisp pixel disc on the main context (no anti-aliasing)
function pdisc(cx, cy, r, col) {

// ============================================================
//  Input: keyboard, gamepads, touch -> per-player virtual pads
// ============================================================
const BUTTONS = ['left', 'right', 'up', 'down', 'fire', 'jump', 'start'];
const KEYMAPS = {
  solo: { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
          fire: ['KeyZ', 'KeyJ', 'KeyC'], jump: ['KeyX', 'KeyK', 'Space'], start: ['Enter', 'KeyP', 'Escape'] },
  p1: { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], fire: ['KeyF'], jump: ['KeyG'], start: ['Enter', 'KeyP', 'Escape'] },
  p2: { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
        fire: ['KeyK', 'Period', 'Numpad1'], jump: ['KeyL', 'Slash', 'Numpad2'], start: ['Enter'] },
};
const MENU_KEYS = {
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  ok: ['Enter', 'Space', 'KeyX', 'KeyK', 'KeyG', 'KeyL', 'NumpadEnter'], back: ['Escape', 'Backspace'],
};
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];

class VPad {
  constructor() { this.cur = {}; this.prev = {}; }
  feed(state) { this.prev = this.cur; this.cur = state; }
  down(b) { return !!this.cur[b]; }
  hit(b) { return !!this.cur[b] && !this.prev[b]; }
  clear() { this.cur = {}; this.prev = {}; }
}

const Input = (() => {
  const keys = {};
  let queue = [];
  const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash', 'Period', 'Backspace', 'Enter']);
  const touch = { left: false, right: false, up: false, down: false, fire: false, jump: false, start: false };
  let touchMode = false;
  let onFirstInput = null;
  let padsAllowed = true;

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (GAME_KEYS.has(e.code) || /^Key|^Digit|^Numpad/.test(e.code)) e.preventDefault();
    if (!e.repeat) queue.push(e.code);
    keys[e.code] = true;
    first();
  }, { passive: false });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; releaseTouch(); });
  canvas.addEventListener('pointerdown', () => { canvas.focus({ preventScroll: true }); first(); });

  function first() { Snd.unlock(); if (onFirstInput) { const f = onFirstInput; onFirstInput = null; f(); } }

  function readKeys(map) {
    const s = {};
    for (const b of BUTTONS) { const ks = map[b]; let v = false; for (let i = 0; i < ks.length; i++) if (keys[ks[i]]) { v = true; break; } s[b] = v; }
    return s;
  }
  function gamepads() {
    if (!padsAllowed || !navigator.getGamepads) return [];
    try { return Array.from(navigator.getGamepads()).filter(g => g && g.connected); }
    catch (e) { padsAllowed = false; return []; }
  }
  function readPad(gp) {
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    return {
      left: b(14) || ax < -0.45, right: b(15) || ax > 0.45, up: b(12) || ay < -0.45, down: b(13) || ay > 0.45,
      fire: b(2) || b(1) || b(5) || b(7), jump: b(0) || b(3) || b(4) || b(6), start: b(9) || b(8),
    };
  }
  function or(a, b) { const s = {}; for (const k of BUTTONS) s[k] = !!(a[k] || b[k]); return s; }

  // players: VPad[2]; mode 1 or 2
  function pollPlayers(pads, mode) {
    const gps = gamepads().map(readPad);
    if (mode === 1) {
      let s = readKeys(KEYMAPS.solo);
      for (const g of gps) s = or(s, g);
      s = or(s, touch);
      pads[0].feed(s); pads[1].feed({});
    } else {
      let a = readKeys(KEYMAPS.p1), b = readKeys(KEYMAPS.p2);
      if (gps[0]) a = or(a, gps[0]);
      if (gps[1]) b = or(b, gps[1]);
      a = or(a, touch);
      pads[0].feed(a); pads[1].feed(b);
    }
  }
  // menu pad: everything merged
  function pollMenu(mpad) {
    const s = {};
    for (const b in MENU_KEYS) s[b] = MENU_KEYS[b].some(k => keys[k]);
    for (const g of gamepads().map(readPad)) {
      s.up = s.up || g.up; s.down = s.down || g.down; s.left = s.left || g.left; s.right = s.right || g.right;
      s.ok = s.ok || g.jump || g.start; s.fire = s.fire || g.fire;
    }
    s.up = s.up || touch.up; s.down = s.down || touch.down; s.left = s.left || touch.left; s.right = s.right || touch.right;
    s.ok = s.ok || touch.jump || touch.start || touch.fire;
    mpad.feed(s);
  }
  function takeQueue() { const q = queue; queue = []; return q; }

  // ---------- touch controls ----------
  const tEl = document.getElementById('touch');
  function enableTouch() {
    if (touchMode) return;
    touchMode = true; tEl.hidden = false; document.body.classList.add('touch');
    fitCanvas();
  }
  window.addEventListener('touchstart', () => { enableTouch(); first(); }, { passive: true });
  function releaseTouch() { for (const k in touch) touch[k] = false; }
  (function setupTouch() {
    const pad = document.getElementById('tPad'), knob = document.getElementById('tKnob');
    let padId = null;
    function padMove(e) {
      const r = pad.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const d = Math.hypot(dx, dy), max = r.width / 2 - 20;
      touch.left = touch.right = touch.up = touch.down = false;
      if (d > 14) {
        const a = Math.atan2(dy, dx), oct = Math.round(a / (Math.PI / 4));
        const dirs = { 0: [1, 0], 1: [1, 1], 2: [0, 1], 3: [-1, 1], 4: [-1, 0], '-4': [-1, 0], '-3': [-1, -1], '-2': [0, -1], '-1': [1, -1] };
        const [ox, oy] = dirs[oct];
        touch.right = ox > 0; touch.left = ox < 0; touch.down = oy > 0; touch.up = oy < 0;
      }
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
    }
    pad.addEventListener('pointerdown', e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); pad.classList.add('on'); padMove(e); e.preventDefault(); });
    pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
    const padEnd = e => { if (e.pointerId !== padId) return; padId = null; pad.classList.remove('on'); touch.left = touch.right = touch.up = touch.down = false; knob.style.transform = ''; };
    pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
    for (const [id, btn] of [['tFire', 'fire'], ['tJump', 'jump'], ['tStart', 'start']]) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', e => { touch[btn] = true; el.classList.add('on'); el.setPointerCapture(e.pointerId); e.preventDefault(); first(); });
      const up = () => { touch[btn] = false; el.classList.remove('on'); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    }
    const mute = document.getElementById('tMute');
    mute.addEventListener('pointerdown', e => { e.preventDefault(); first(); if (Input.onMute) Input.onMute(); });
    tEl.addEventListener('contextmenu', e => e.preventDefault());
  })();

  return {
    pollPlayers, pollMenu, takeQueue,
    held: code => !!keys[code],
    set onFirst(f) { onFirstInput = f; },
    onMute: null,
    get touchMode() { return touchMode; },
    padCount: () => gamepads().length,
    _keys: keys,
  };
})();

    { k: [0, -8], f: [-2, -1] },
    { k: [-2, -8], f: [-6, -2] },
    { k: [0, -10], f: [-4, -5] },
    { k: [4, -11], f: [3, -5] },
  ],
};
function runLegs(i) {
  const f = LEGSETS.run[i % 6], b = LEGSETS.run[(i + 3) % 6];
  return { fk: f.k, ff: f.f, bk: b.k, bf: b.f };
}

// Muzzle offsets (relative to feet anchor, facing right) per upright aim
const MUZZLE = { fwd: [15, -20], up: [3, -39], dup: [11, -30], ddown: [11, -11] };

function drawLeg(P, hx, hy, kx, ky, fx, fy, col, boot) {
  P.line(hx, hy, kx, ky, col, 3);
  P.line(kx, ky, fx, fy - 2, col, 3);
  P.rect(fx - 1, fy - 2, 5, 3, boot);
  P.set(fx + 3, fy, boot);
}

function drawChar(P, pal, o) {
  const X = dx => 24 + dx, Y = dy => 45 + dy;
  const c = k => rgb(pal[k]);
  const b = o.bob || 0;
  const L = o.legs;
  // legs
  drawLeg(P, X(-1), Y(-14), X(L.bk[0]), Y(L.bk[1]), X(L.bf[0]), Y(L.bf[1]), c('pantsD'), c('bootD'));
  drawLeg(P, X(1), Y(-14), X(L.fk[0]), Y(L.fk[1]), X(L.ff[0]), Y(L.ff[1]), c('pants'), c('boot'));
  // front-leg highlight (knee)
  P.set(X(L.fk[0]) + 1, Y(L.fk[1]) - 1, c('pantsL'));
  // arms behind torso (back arm) — drawn per aim below; torso first
  const top = Y(-23) + b;
  const th = Y(-14) - top + 1;
  const aim = o.aim || 'fwd';
  // back arm (behind torso)
  const backArm = {
    fwd: [X(-1), Y(-21) + b, X(3), Y(-18) + b],
    up: [X(-1), Y(-22) + b, X(3), Y(-26) + b],
    dup: [X(-1), Y(-21) + b, X(3), Y(-22) + b],
    ddown: [X(-1), Y(-21) + b, X(3), Y(-18) + b],
    throw: [X(-1), Y(-22) + b, X(-5), Y(-29) + b],
    hurt: [X(-1), Y(-22) + b, X(-5), Y(-29) + b],
  }[aim];
  if (backArm) P.line(backArm[0], backArm[1], backArm[2], backArm[3], c('skinD'), 2);
  if (aim === 'throw') { P.rect(X(-7), Y(-32) + b, 3, 3, rgb('#45612c')); P.set(X(-6), Y(-33) + b, rgb('#9aa0a8')); }
  // torso
  P.rect(X(-3), top, 7, th, c('top'));
  P.rect(X(-3), top, 1, th - 2, c('topD'));
  P.rect(X(3), top + 1, 1, th - 3, c('topL'));
  P.rect(X(-2), top, 2, 1, c('skin'));            // shoulder skin (tank top)
  P.rect(X(-3), Y(-15), 7, 2, c('belt'));
  P.set(X(2), Y(-15), rgb('#f0e0a0'));
  // head
  if (o.head === 'helmet') {
    P.rect(X(-1), Y(-29) + b, 5, 5, c('skin'));
    P.rect(X(-1), Y(-25) + b, 4, 1, c('skinD'));
    P.rect(X(-3), Y(-32) + b, 7, 3, c('helm'));
    P.rect(X(-1), Y(-32) + b, 3, 1, c('helmL'));
    P.rect(X(-4), Y(-29) + b, 9, 1, c('helmD'));
    P.rect(X(-3), Y(-28) + b, 2, 4, c('helmD'));
    P.rect(X(1), Y(-27) + b, 3, 1, c('visor'));
    P.set(X(4), Y(-26) + b, c('skin'));
  } else {
    P.rect(X(-2), Y(-31) + b, 6, 7, c('skin'));
    P.rect(X(-2), Y(-25) + b, 4, 1, c('skinD'));
    P.rect(X(-3), Y(-32) + b, 6, 2, c('hair'));
    P.rect(X(-3), Y(-28) + b, 2, 3, c('hair'));
    P.rect(X(-3), Y(-30) + b, 7, 2, c('band'));
    P.rect(X(-3), Y(-29) + b, 7, 1, c('bandD'));
    const fl = o.flutter || 0;
    P.line(X(-4), Y(-30) + b, X(-7), Y(-29) + b + fl, c('band'), 2);
    P.line(X(-5), Y(-28) + b, X(-8), Y(-26) + b + fl, c('bandD'), 1);
    P.set(X(2), Y(-27) + b, c('eye'));
    P.set(X(4), Y(-27) + b, c('skin'));
    P.set(X(-1), Y(-27) + b, c('skinD'));
  }
  P.rect(X(-1), Y(-24) + b, 3, 1, c('skinD'));
  // gun + front arm
  const G = c('gun'), GD = c('gunD'), GL = c('gunL'), SK = c('skin');
  if (aim === 'fwd') {
    P.rect(X(-2), Y(-20) + b, 3, 3, GD);
    P.rect(X(1), Y(-20) + b, 12, 2, G);
    P.rect(X(2), Y(-20) + b, 9, 1, GL);
    P.rect(X(5), Y(-18) + b, 2, 2, GD);
    P.rect(X(13), Y(-20) + b, 2, 1, GD);
    P.line(X(1), Y(-22) + b, X(7), Y(-18) + b, SK, 2);
  } else if (aim === 'up') {
    P.rect(X(2), Y(-23) + b, 3, 3, GD);
    P.rect(X(3), Y(-35) + b, 2, 12, G);
    P.rect(X(3), Y(-34) + b, 1, 9, GL);
    P.rect(X(5), Y(-30) + b, 2, 2, GD);
    P.rect(X(3), Y(-37) + b, 1, 2, GD);
    P.line(X(1), Y(-22) + b, X(4), Y(-30) + b, SK, 2);
  } else if (aim === 'dup') {
    P.rect(X(-1), Y(-19) + b, 2, 2, GD);
    P.line(X(1), Y(-20) + b, X(9), Y(-28) + b, G, 2);
    P.line(X(1), Y(-21) + b, X(8), Y(-28) + b, GL, 1);
    P.line(X(9), Y(-28) + b, X(10), Y(-29) + b, GD, 2);
    P.line(X(1), Y(-22) + b, X(6), Y(-25) + b, SK, 2);
  } else if (aim === 'ddown') {
    P.rect(X(-1), Y(-23) + b, 2, 2, GD);
    P.line(X(1), Y(-21) + b, X(9), Y(-13) + b, G, 2);
    P.line(X(2), Y(-21) + b, X(9), Y(-14) + b, GL, 1);
    P.line(X(9), Y(-13) + b, X(10), Y(-12) + b, GD, 2);
    P.line(X(1), Y(-22) + b, X(6), Y(-17) + b, SK, 2);
  } else if (aim === 'throw') {
    P.line(X(1), Y(-22) + b, X(5), Y(-19) + b, SK, 2);
  } else if (aim === 'hurt') {
    P.line(X(1), Y(-22) + b, X(5), Y(-30) + b, SK, 2);
  }
}

function charSprite(pal, o) {
  const P = new Painter(48, 48);
  drawChar(P, pal, o);
  P.outline(rgb(OUTLINE));
  return makeSprite(P, 24, 45);
}

function proneSprite(pal) {
  const P = new Painter(48, 48);
  const X = dx => 24 + dx, Y = dy => 45 + dy;
  const c = k => rgb(pal[k]);
  // legs (back then front)
  P.line(X(-15), Y(-5), X(-4), Y(-5), c('pantsD'), 3);
  P.line(X(-14), Y(-2), X(-3), Y(-3), c('pants'), 3);
  P.rect(X(-18), Y(-7), 3, 4, c('bootD'));
  P.rect(X(-17), Y(-4), 3, 4, c('boot'));
  // torso
  P.rect(X(-3), Y(-8), 9, 7, c('top'));
  P.rect(X(-3), Y(-8), 9, 1, c('topL'));
  P.rect(X(-4), Y(-8), 2, 7, c('belt'));
  // head (raised)
  P.rect(X(6), Y(-11), 6, 6, c('skin'));
  P.rect(X(6), Y(-12), 6, 2, c('hair'));
  P.rect(X(5), Y(-11), 7, 2, c('band'));
  P.line(X(4), Y(-11), X(1), Y(-13), c('band'), 2);
  P.set(X(10), Y(-8), c('eye'));
  P.set(X(12), Y(-8), c('skin'));
  // gun + arms
  P.rect(X(7), Y(-5), 15, 2, c('gun'));
  P.rect(X(8), Y(-5), 12, 1, c('gunL'));
  P.rect(X(22), Y(-5), 2, 1, c('gunD'));
  P.rect(X(11), Y(-3), 2, 2, c('gunD'));
  P.line(X(3), Y(-4), X(12), Y(-3), c('skin'), 2);
  P.outline(rgb(OUTLINE));
  return makeSprite(P, 24, 45);
}

function ballSprites(pal) {
  const P = new Painter(24, 24);
  const c = k => rgb(pal[k]);
  P.disc(12, 12, 7, c('pantsD'));
  P.disc(11, 13, 5, c('pants'));
  P.disc(14, 9, 4, c('top'));
  P.rect(12, 5, 3, 2, c('topL'));
  P.disc(17, 7, 3, c('skin'));
  P.rect(15, 4, 5, 2, c('band'));
  P.set(19, 7, c('eye'));
  P.rect(5, 12, 3, 4, c('boot'));
  P.rect(8, 17, 4, 3, c('bootD'));
  P.rect(15, 13, 6, 2, c('gun'));
  P.rect(15, 13, 5, 1, c('gunL'));
  P.rect(13, 12, 3, 3, c('skin'));
  P.outline(rgb(OUTLINE));
  const base = P.toCanvas();
  const frames = [];
  for (let i = 0; i < 4; i++) frames.push(makeSprite(rotCanvas(base, i), 12, 23));
  return frames;
}

function deadSprite(pal, head) {
  const P = new Painter(48, 48);
  const X = dx => 24 + dx, Y = dy => 45 + dy;
  const c = k => rgb(pal[k]);
  P.line(X(1), Y(-3), X(12), Y(-3), c('pantsD'), 3);
  P.line(X(1), Y(-2), X(12), Y(-5), c('pants'), 3);
  P.rect(X(13), Y(-8), 3, 4, c('boot'));
  P.rect(X(13), Y(-4), 3, 4, c('bootD'));
  P.rect(X(-8), Y(-6), 9, 5, c('top'));
  P.rect(X(0), Y(-6), 2, 5, c('belt'));
  if (head === 'helmet') { P.rect(X(-14), Y(-6), 6, 5, c('skin')); P.rect(X(-15), Y(-8), 5, 7, c('helm')); }
  else { P.rect(X(-14), Y(-7), 6, 6, c('skin')); P.rect(X(-15), Y(-7), 2, 6, c('hair')); P.rect(X(-13), Y(-7), 2, 6, c('band')); }
  P.line(X(-6), Y(-6), X(-2), Y(-9), c('skin'), 2);
  P.outline(rgb(OUTLINE));
  return makeSprite(P, 24, 45);
}

// Build the complete frame set for a character palette
function buildCharSet(pal, head) {
  const S = { stand: {}, run: {}, fall: {} };
  for (const aim of ['fwd', 'up', 'dup', 'ddown']) {
    S.stand[aim] = [0, 1].map(fl => charSprite(pal, { head, aim, legs: LEGSETS.stand, flutter: fl }));
    S.run[aim] = [];
    for (let i = 0; i < 6; i++) S.run[aim].push(charSprite(pal, { head, aim, legs: runLegs(i), bob: (i === 1 || i === 4) ? -1 : 0, flutter: i % 2 }));
    S.fall[aim] = charSprite(pal, { head, aim, legs: LEGSETS.fall, flutter: 1 });
  }
  S.throw = charSprite(pal, { head, aim: 'throw', legs: LEGSETS.stand });
  S.hurt = charSprite(pal, { head, aim: 'hurt', legs: LEGSETS.fall });
  S.dead = deadSprite(pal, head);
  if (head !== 'helmet') { S.prone = proneSprite(pal); S.ball = ballSprites(pal); }
  return S;
}

// ============================================================
//  Sprites — objects, enemies, items, effects
// ============================================================
function P_(w, h) { return new Painter(w, h); }
const C = hex => rgb(hex);

// ---------- bullets & projectiles ----------
function buildBullets() {
  const B = {};
  let P = P_(5, 5); P.rect(1, 0, 3, 5, C('#ffb4a0')); P.rect(0, 1, 5, 3, C('#ffb4a0')); P.rect(1, 1, 3, 3, C('#ffffff'));
  B.pb = makeSprite(P, 2.5, 2.5);
  P = P_(5, 5); P.rect(1, 0, 3, 5, C('#ffe27a')); P.rect(0, 1, 5, 3, C('#ffe27a')); P.rect(1, 1, 3, 3, C('#ffffff'));
  B.mg = makeSprite(P, 2.5, 2.5);
  for (const [k, r] of [['sp1', 2], ['sp2', 3], ['sp3', 4]]) {
    const s = r * 2 + 3; P = P_(s, s); const c = (s - 1) / 2;
    P.disc(c, c, r, C('#e8301e')); P.disc(c - 0.5, c - 0.5, Math.max(1, r - 1), C('#ff7a5a')); P.set(c - 1, c - 1, C('#fff0e0'));
    P.outline(C('#5a0808'));
    B[k] = makeSprite(P, s / 2, s / 2);
  }
  for (let i = 0; i < 2; i++) {
    P = P_(11, 11);
    P.disc(5, 5, 4, C(i ? '#ff6a10' : '#ff8a1a')); P.disc(5, 5, 3, C('#ffb030')); P.disc(5 - i, 5, 2, C('#ffe870')); P.set(4, 4, C('#ffffff'));
    B['fire' + i] = makeSprite(P, 5.5, 5.5);
  }
  P = P_(7, 7); P.disc(3, 3, 2, C('#ff6a8e')); P.rect(2, 2, 3, 3, C('#ffffff')); P.outline(C('#2a0612'));
  B.eb = makeSprite(P, 3.5, 3.5);
  P = P_(11, 11); P.disc(5, 5, 4, C('#ff5a1e')); P.disc(5, 5, 3, C('#ffa040')); P.disc(4, 4, 1, C('#ffffff')); P.outline(C('#3a0a04'));
  B.orb = makeSprite(P, 5.5, 5.5);
  for (let i = 0; i < 2; i++) {
    P = P_(8, 8); P.disc(4, 4, 2, C('#4c6a30')); P.rect(3, 2, 2, 1, C('#8aa860')); P.set(i ? 6 : 2, i ? 2 : 6, C('#b0b4bc')); P.outline(C('#101408'));
    B['gren' + i] = makeSprite(P, 4, 4);
  }
  for (let i = 0; i < 2; i++) {
    P = P_(10, 10); P.disc(5, 5, 3, C(i ? '#9ae04a' : '#7cc83a')); P.disc(4, 4, 1, C('#e8ffb0')); P.set(6, 6, C('#2a5010')); P.outline(C('#12200a'));
    B['spore' + i] = makeSprite(P, 5, 5);
  }
  // missiles: 16 directions
  B.missile = [];
  for (let d = 0; d < 16; d++) {
    P = P_(20, 20); const [vx, vy] = vec16(d);
    P.line(10 - vx * 6, 10 - vy * 6, 10 + vx * 4, 10 + vy * 4, C('#a8aeb8'), 3);
    P.line(10 + vx * 4, 10 + vy * 4, 10 + vx * 6, 10 + vy * 6, C('#e03a2a'), 2);
    P.line(10 - vx * 6 - vy * 2, 10 - vy * 6 + vx * 2, 10 - vx * 6 + vy * 2, 10 - vy * 6 - vx * 2, C('#5a5f6a'), 1);
    P.outline(C('#101018'));
    B.missile.push(makeSprite(P, 10, 10));
  }
  // muzzle flash
  P = P_(9, 9); P.rect(3, 0, 3, 9, C('#fff2a0')); P.rect(0, 3, 9, 3, C('#fff2a0')); P.rect(2, 2, 5, 5, C('#ffffff'));
  B.flash = makeSprite(P, 4.5, 4.5);
  return B;
}

// ---------- explosions ----------
function explosionFrames(R, seed) {
  const rng = mulberry(seed);
  const size = Math.ceil(R * 2.6) + 4, c = size / 2;
  const blobs = [[0, 0, 1]];
  for (let i = 0; i < 6; i++) blobs.push([(rng() - 0.5) * R * 0.9, (rng() - 0.5) * R * 0.9, 0.45 + rng() * 0.35]);
  const pal = [
    ['#fff6c0', '#ffffff', '#ffffff'],
    ['#ff9a2a', '#ffe45a', '#ffffff'],
    ['#e8442a', '#ff9a2a', '#ffe45a'],
    ['#8a1e1a', '#e8442a', '#ffb040'],
    ['#4a4048', '#8a1e1a', '#e8602a'],
    ['#4a4048', '#5e5460', '#8a2a1e'],
    ['#3e3640', '#4a4048', null],
    ['#3e3640', null, null],
  ];
  const scale = [0.35, 0.6, 0.85, 1.0, 1.05, 1.1, 1.12, 1.14];
  const frames = [];
  for (let f = 0; f < 8; f++) {
    const P = P_(size, size);
    const sc = scale[f] * R;
    const layers = pal[f];
    const ls = [1, 0.72, 0.42];
    for (let L = 0; L < 3; L++) {
      if (!layers[L]) continue;
      for (const [bx, by, br] of blobs) P.disc(c + bx * (f / 7 + 0.4), c + by * (f / 7 + 0.4) - f * 0.5, Math.max(1, Math.round(sc * br * ls[L])), C(layers[L]));
    }
    if (f >= 6) { // dissolve smoke
      for (let i = 0; i < P.buf.length; i++) if (P.buf[i] && ((i * 7 + f * 13) % (f === 6 ? 3 : 2) === 0)) P.buf[i] = 0;
    }
    frames.push(makeSprite(P, c, c));
  }
  return frames;
}

// ---------- turret (wall gun), 16 directions ----------
function buildTurret(theme) {
  const plate = theme === 'base' ? ['#4c5668', '#7c889c', '#262c38'] : ['#4a4f5c', '#7c8292', '#262930'];
  function base(P) {
    P.rect(2, 2, 28, 28, C(plate[0]));
    P.rect(2, 2, 28, 1, C(plate[1])); P.rect(2, 2, 1, 28, C(plate[1]));
    P.rect(2, 29, 28, 1, C(plate[2])); P.rect(29, 2, 1, 28, C(plate[2]));
    for (const [x, y] of [[4, 4], [26, 4], [4, 26], [26, 26]]) { P.rect(x, y, 2, 2, C('#a4acba')); P.set(x + 1, y + 1, C('#3a3e48')); }
    P.disc(16, 16, 11, C('#23262e')); P.disc(16, 16, 10, C('#6a7080')); P.disc(16, 16, 8, C('#50566a'));
    P.ring(16, 16, 10, C('#8c93a4'));
  }
  const T = { open: [], closed: null };
  let P = P_(32, 32); base(P);
  P.disc(16, 16, 8, C('#7a8090')); P.rect(8, 15, 17, 2, C('#3a3e4a')); P.rect(15, 8, 2, 17, C('#3a3e4a')); P.disc(16, 16, 2, C('#3a3e4a'));
  P.outline(C('#0c0b14')); T.closed = makeSprite(P, 16, 16);
  for (let d = 0; d < 16; d++) {
    P = P_(32, 32); base(P);
    const [vx, vy] = vec16(d);
    P.line(16, 16, 16 + vx * 14, 16 + vy * 14, C('#23262e'), 5);
    P.line(16, 16, 16 + vx * 13, 16 + vy * 13, C('#7a8292'), 3);
    P.line(16 - vy * 0.8, 16 + vx * 0.8, 16 + vx * 12 - vy * 0.8, 16 + vy * 12 + vx * 0.8, C('#b4bbc8'), 1);
    P.disc(16, 16, 5, C('#23262e')); P.disc(16, 16, 4, C('#b42a2a')); P.disc(15, 15, 2, C('#ff5a48')); P.set(14, 14, C('#ffd8c8'));
    P.outline(C('#0c0b14'));
    T.open.push(makeSprite(P, 16, 16));
  }
  P = P_(32, 32); base(P);
  P.disc(16, 16, 8, C('#2a2226')); P.disc(16, 16, 5, C('#3a2a2a')); P.set(13, 14, C('#ff7a3a')); P.set(18, 17, C('#ffb040'));
  P.outline(C('#0c0b14')); T.wreck = makeSprite(P, 16, 16);
  return T;
}

// ---------- rising cannon (3 angles: 0=left, 1=up-left 30, 2=up-left 60) ----------
function buildCannon() {
  const frames = [];
  const angs = [Math.PI, Math.PI * 7 / 6, Math.PI * 4 / 3];
  for (let i = 0; i < 3; i++) {
    const P = P_(36, 30);
    const cx = 20, cy = 15;
    const a = angs[i], vx = Math.cos(a), vy = Math.sin(a);
    P.line(cx, cy, cx + vx * 17, cy + vy * 17, C('#1e2128'), 6);
    P.line(cx, cy, cx + vx * 16, cy + vy * 16, C('#6a7282'), 4);
    P.line(cx - vy, cy + vx * 0.2 - 1, cx + vx * 15 - vy, cy + vy * 15 - 1, C('#a8b0bc'), 1);
    P.rect(6, 18, 28, 10, C('#4e5666')); P.rect(6, 18, 28, 2, C('#8a93a4')); P.rect(6, 26, 28, 2, C('#2a2e38'));
    for (let x = 8; x < 33; x += 5) P.rect(x, 22, 2, 2, C('#2a2e38'));
    P.disc(cx, cy + 2, 7, C('#5a6272')); P.disc(cx - 1, cy + 1, 5, C('#7a8292')); P.rect(cx - 3, cy - 2, 3, 1, C('#b8c0cc'));
    P.rect(cx + 1, cy + 2, 3, 2, C('#e0402a'));
    P.outline(C('#0c0b14'));
    frames.push(makeSprite(P, 20, 28));
  }
  const P = P_(36, 30);
  P.rect(6, 18, 28, 10, C('#3a3036')); P.rect(9, 14, 20, 5, C('#2a2226')); P.set(14, 16, C('#ff8a3a')); P.set(22, 15, C('#ffb040'));
  P.outline(C('#0c0b14'));
  frames.push(makeSprite(P, 20, 28));
  return frames;
}

// ---------- pillbox sensor: 0 closed, 1 half, 2 open, 3 wreck ----------
function buildPillbox(theme) {
  const out = [];
  const shell = theme === 'alien' ? ['#6a3a4a', '#a0607a', '#321a24', '#8a4a5e'] : ['#5a6070', '#8c94a4', '#2a2d36', '#747c8c'];
  for (let s = 0; s < 4; s++) {
    const P = P_(26, 26);
    P.rect(1, 1, 24, 24, C(shell[0])); P.rect(1, 1, 24, 1, C(shell[1])); P.rect(1, 1, 1, 24, C(shell[1]));
    P.rect(1, 24, 24, 1, C(shell[2])); P.rect(24, 1, 1, 24, C(shell[2]));
    P.rect(4, 4, 18, 18, C('#1c0e10'));
    if (s === 3) { P.rect(5, 6, 16, 14, C('#2a2020')); P.set(9, 10, C('#ff8a3a')); P.set(15, 14, C('#ffb040')); }
    else {
      if (s > 0) {
        P.disc(13, 13, 6, C('#7a1010')); P.disc(13, 13, 5, C('#e8301e')); P.disc(13, 13, 3, C('#ff9040')); P.disc(12, 12, 1, C('#fff0b0'));
        P.rect(5, 12, 4, 2, C('#e0b040')); P.rect(17, 12, 4, 2, C('#e0b040'));
      }

// ============================================================
//  Level: tile map, collision, chunked static rendering
// ============================================================
const T_EMPTY = 0, T_SOLID = 1, T_LEDGE = 2, T_WSURF = 3, T_WATER = 4;
const GRAV = 0.22, MAXFALL = 5.2;
let L = null; // current level

function loadLevel(def) {
  const rows = def.map;
  const th = rows.length, tw = rows[0].length;
  const lv = {
    def, theme: def.theme, tw, th, pw: tw * TS, ph: th * TS,
    tiles: new Uint8Array(tw * th), spawns: [], chunks: new Map(), platforms: [], deco: [],
    waterTop: new Int16Array(tw).fill(-1), seed: def.seed || 1234,
  };
  for (let ty = 0; ty < th; ty++) {
    const row = rows[ty];
    for (let tx = 0; tx < tw; tx++) {
      const ch = row[tx] || '.';
      let t = T_EMPTY;
      if (ch === '#') t = T_SOLID;
      else if (ch === '=') t = T_LEDGE;
      else if (ch === '~') t = T_WSURF;
      else if (ch === 'w') t = T_WATER;
      else if (ch === 'T' || ch === 'M') t = T_SOLID;
      else if (ch === 'D') t = T_WSURF;
      if (ch !== '.' && ch !== '#' && ch !== '=' && ch !== '~' && ch !== 'w') {
        lv.spawns.push({ ch, tx, ty, x: tx * TS + 8, y: ty * TS + 8, done: false });
      }
      lv.tiles[ty * tw + tx] = t;
    }
  }
  for (let tx = 0; tx < tw; tx++) for (let ty = 0; ty < th; ty++) if (lv.tiles[ty * tw + tx] === T_WSURF) { lv.waterTop[tx] = ty; break; }
  lv.spawns.sort((a, b) => def.scroll === 'v' ? b.y - a.y : a.x - b.x);
  return lv;
}

function tileAt(tx, ty) {
  if (ty < 0 || ty >= L.th) return T_EMPTY;
  if (tx < 0 || tx >= L.tw) return T_SOLID;
  return L.tiles[ty * L.tw + tx];
}
function tileAtPx(x, y) { return tileAt(Math.floor(x / TS), Math.floor(y / TS)); }
function solidAt(x, y) { return tileAtPx(x, y) === T_SOLID; }
function setTile(tx, ty, t) { if (tx >= 0 && ty >= 0 && tx < L.tw && ty < L.th) L.tiles[ty * L.tw + tx] = t; }
function waterLineAt(x) { const r = L.waterTop[Math.floor(x / TS)]; return r >= 0 ? r * TS + 4 : null; }

// Find the first standable surface crossed while moving feet from py to ny (downward)
function findLanding(xl, xr, py, ny, drop, swim) {
  const r0 = Math.floor((py - 0.5) / TS), r1 = Math.floor(ny / TS);
  const xs = [xl, xr, (xl + xr) / 2];
  let best = null;
  for (let r = r0; r <= r1 && best === null; r++) {
    const top = r * TS;
    if (top < py - 0.5 || top > ny) continue;
    for (const x of xs) {
      const t = tileAt(Math.floor(x / TS), r);
      if (t === T_SOLID || (t === T_LEDGE && !drop) || (t === T_WATER && swim)) { best = top; break; }
    }
  }
  let plat = null;
  for (const p of L.platforms) {
    if (xr < p.x || xl > p.x + p.w) continue;
    if (p.oneway !== false && drop) continue;
    const prevTop = p.py === undefined ? p.y : p.py;
    if (py <= Math.max(p.y, prevTop) + 0.5 && ny >= p.y) {
      if (best === null || p.y < best) { best = p.y; plat = p; }
    }
  }
  return best === null ? null : { y: best, plat };
}

// Generic body physics. b: {x, y (feet), vx, vy, hw, h}
function moveBody(b, o = {}) {
  b.hitWall = 0;
  if (b.vx) {
    const nx = b.x + b.vx;
    const edge = b.vx > 0 ? nx + b.hw : nx - b.hw;
    let blocked = false;
    for (const sy of [b.y - 2, b.y - b.h * 0.5, b.y - b.h + 2]) if (solidAt(edge, sy)) { blocked = true; break; }
    if (blocked) {
      if (b.vx > 0) b.x = Math.floor(edge / TS) * TS - b.hw - 0.01;
      else b.x = (Math.floor(edge / TS) + 1) * TS + b.hw + 0.01;
      b.hitWall = sign(b.vx);
    } else b.x = nx;
  }
  const g = o.grav === undefined ? GRAV : o.grav;
  b.vy = Math.min(b.vy + g, o.maxFall || MAXFALL);
  const py = b.y;
  let ny = b.y + b.vy;
  const wasGround = b.onGround;
  b.onGround = false; b.plat = null;
  if (b.vy >= 0) {
    const land = findLanding(b.x - b.hw + 1, b.x + b.hw - 1, py, ny, o.drop, o.swim);
    if (land) { ny = land.y; b.vy = 0; b.onGround = true; b.plat = land.plat; }
  } else {
    const hy = ny - b.h;
    if (solidAt(b.x - b.hw + 1, hy) || solidAt(b.x + b.hw - 1, hy)) {
      ny = (Math.floor(hy / TS) + 1) * TS + b.h; b.vy = 0;
    }
  }
  b.y = ny;
  b.landed = b.onGround && !wasGround;
}
// is there ground directly ahead (for AI edge detection)
function groundAhead(x, y, dir, dist = 10) {
  const t = tileAtPx(x + dir * dist, y + 2);
  return t === T_SOLID || t === T_LEDGE;
}
// find standable surfaces in a column within [y0, y1]
function surfacesInColumn(x, y0, y1) {
  const out = [];
  const tx = Math.floor(x / TS);
  for (let ty = Math.max(1, Math.floor(y0 / TS)); ty <= Math.min(L.th - 1, Math.floor(y1 / TS)); ty++) {
    const t = tileAt(tx, ty), a = tileAt(tx, ty - 1), a2 = tileAt(tx, ty - 2);
    if ((t === T_SOLID || t === T_LEDGE) && a !== T_SOLID && a2 !== T_SOLID && a !== T_WSURF) out.push(ty * TS);
  }
  return out;
}

// ------------------------------------------------------------
//  Static chunk rendering (tiles + decorations)
// ------------------------------------------------------------
const CHUNK = 256;
function tileInfo(tx, ty) {
  const t = tileAt(tx, ty);
  const up = tileAt(tx, ty - 1), dn = tileAt(tx, ty + 1), lf = tileAt(tx - 1, ty), rt = tileAt(tx + 1, ty);
  let depth = 0;
  while (depth < 6 && tileAt(tx, ty - depth - 1) === T_SOLID) depth++;
  return { t, up, dn, lf, rt, depth, topOpen: up !== T_SOLID, leftOpen: lf !== T_SOLID && tx > 0, rightOpen: rt !== T_SOLID && tx < L.tw - 1, botOpen: dn !== T_SOLID && ty < L.th - 1 };
}
function cellNoise(x, y, cs, seed) {
  const cx = Math.floor(x / cs), cy = Math.floor(y / cs);
  let f1 = 1e9, f2 = 1e9, id = 0, fy1 = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const gx = cx + i, gy = cy + j;
    const fx = (gx + 0.15 + 0.7 * hash2(gx * 7 + seed, gy * 13)) * cs, fy = (gy + 0.15 + 0.7 * hash2(gx * 11, gy * 5 + seed)) * cs;
    const d = (x - fx) * (x - fx) + (y - fy) * (y - fy) * 1.3;
    if (d < f1) { f2 = f1; f1 = d; id = gx * 31 + gy * 17; fy1 = fy; } else if (d < f2) f2 = d;
  }
  return { e: Math.sqrt(f2) - Math.sqrt(f1), id, above: y < fy1 - 1.5, d1: Math.sqrt(f1) };
}

const THEMES = {};

function getChunk(cx, cy) {
  const key = cx + ',' + cy;
  let c = L.chunks.get(key);
  if (c) return c;
  const P = new Painter(CHUNK, CHUNK);
  const ox = cx * CHUNK, oy = cy * CHUNK;
  const th = THEMES[L.theme];
  const tx0 = Math.floor(ox / TS), ty0 = Math.floor(oy / TS);
  for (let ty = ty0; ty < ty0 + CHUNK / TS; ty++) for (let tx = tx0; tx < tx0 + CHUNK / TS; tx++) {
    if (tx >= L.tw || ty >= L.th) continue;
    const t = tileAt(tx, ty);
    if (L.hideFrom !== undefined && tx >= L.hideFrom && ty <= 10) continue;
    if (t === T_SOLID) th.solid(P, tx * TS - ox, ty * TS - oy, tx, ty, tileInfo(tx, ty));
  }
  // decorations behind ledges? draw decorations, then ledges on top
  for (const d of L.deco) {
    if (d.x + d.w < ox || d.x > ox + CHUNK || d.y + d.h < oy || d.y > oy + CHUNK) continue;
    d.paint(P, d.x - ox, d.y - oy);
  }
  for (let ty = ty0; ty < ty0 + CHUNK / TS; ty++) for (let tx = tx0; tx < tx0 + CHUNK / TS; tx++) {
    if (tx >= L.tw || ty >= L.th) continue;
    if (tileAt(tx, ty) === T_LEDGE) th.ledge(P, tx * TS - ox, ty * TS - oy, tx, ty, tileInfo(tx, ty));
  }
  // solids painted again on top of decorations that overlapped them (keeps terrain crisp in front)
  for (let ty = ty0; ty < ty0 + CHUNK / TS; ty++) for (let tx = tx0; tx < tx0 + CHUNK / TS; tx++) {
    if (tx >= L.tw || ty >= L.th) continue;
    if (tileAt(tx, ty) === T_SOLID && L.decoCover && L.decoCover.has(tx + ',' + ty)) th.solid(P, tx * TS - ox, ty * TS - oy, tx, ty, tileInfo(tx, ty));
  }
  c = P.toCanvas();
  L.chunks.set(key, c);
  return c;
}
function prerenderLevel() {
  L.chunks.clear();
  const th = THEMES[L.theme];
  L.deco = th.decorate ? th.decorate() : [];
  L.decoCover = new Set();
  for (let cy = 0; cy * CHUNK < L.ph; cy++) for (let cx = 0; cx * CHUNK < L.pw; cx++) getChunk(cx, cy);
}
function drawLevelTiles(camX, camY) {
  const cx0 = Math.floor(camX / CHUNK), cx1 = Math.floor((camX + W - 1) / CHUNK);
  const cy0 = Math.floor(camY / CHUNK), cy1 = Math.floor((camY + H - 1) / CHUNK);
  for (let cy = Math.max(0, cy0); cy <= cy1; cy++) for (let cx = Math.max(0, cx0); cx <= cx1; cx++) {
    if (cx * CHUNK >= L.pw || cy * CHUNK >= L.ph) continue;
    ctx.drawImage(getChunk(cx, cy), cx * CHUNK, cy * CHUNK);
  }
}

// ------------------------------------------------------------
//  Water (drawn dynamically)
// ------------------------------------------------------------

      const yy = Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
      for (let k = yy; k < h; k++) P.set(x, k, rgb(col));
      if (opts.rim) P.set(x, yy, rgb(opts.rim));
    }
  }
}

function updateFx() {
  const fx = G.fx;
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    if (f.k === 'ex') {
      if (f.delay > 0) { f.delay--; if (f.delay === 0) Snd.play('boom'); continue; }
      f.t++; if (f.t >= f.fr.length * f.rate) fx.splice(i, 1);
    } else if (f.k === 'p') {
      f.x += f.vx; f.y += f.vy; f.vy += f.g; if (--f.life <= 0) fx.splice(i, 1);
    } else if (f.k === 'txt') { f.y -= 0.4; if (--f.life <= 0) fx.splice(i, 1); }
    else if (f.k === 'ring') { f.t++; if (f.t >= f.life) fx.splice(i, 1); }
    else if (f.k === 'mz') { if (--f.life <= 0) fx.splice(i, 1); }
    else if (f.k === 'smoke') { f.x += f.vx; f.y += f.vy; if (--f.life <= 0) fx.splice(i, 1); }
    else if (f.k === 'corpse') {
      f.x += f.vx; f.y += f.vy; f.vy += 0.2; f.t++;
      if (f.t > 40) fx.splice(i, 1);
    }
  }
}

const WEAPONS = {
  N: { name: 'RIFLE', rate: 9, tap: 5, max: 4, speed: 4.8, dmg: 1, sfx: 'shot' },
  M: { name: 'MACHINE GUN', rate: 5, tap: 5, max: 9, speed: 5.4, dmg: 1, sfx: 'mg' },
  S: { name: 'SPREAD', rate: 13, tap: 9, max: 15, speed: 4.4, dmg: 1, sfx: 'spread' },
  L: { name: 'LASER', rate: 18, tap: 12, max: 1, speed: 7.5, dmg: 4, sfx: 'laser' },
  F: { name: 'FLAME', rate: 13, tap: 9, max: 4, speed: 3.8, dmg: 2, sfx: 'fire' },
};

function firePlayerWeapon(p, mx, my, dx, dy) {
  const w = WEAPONS[p.weapon];
  const rapid = p.rapid ? 1.35 : 1;
  const own = G.pb.filter(b => b.owner === p);
  if (p.weapon === 'L') { for (const b of own) b.dead = true; }
  else if (own.length >= w.max * (p.rapid ? 1.4 : 1)) return false;
  const n = hypot(dx, dy) || 1; dx /= n; dy /= n;
  const sp = w.speed * rapid;
  const mk = (vx, vy, kind, extra) => G.pb.push(Object.assign({ x: mx, y: my, vx, vy, kind, owner: p, dmg: w.dmg, t: 0, dead: false, hit: null }, extra || {}));
  if (p.weapon === 'S') {
    const base = Math.atan2(dy, dx);
    for (const off of [-0.28, -0.14, 0, 0.14, 0.28]) mk(Math.cos(base + off) * sp, Math.sin(base + off) * sp, 'S');
  } else if (p.weapon === 'L') {
    mk(dx * sp, dy * sp, 'L', { dx, dy, len: 4, pierce: true, hit: new Set() });
  } else if (p.weapon === 'F') {
    mk(dx * sp, dy * sp, 'F', { bx: mx, by: my, dx, dy, pierce: false });
  } else {
    mk(dx * sp, dy * sp, p.weapon);
  }
  Snd.play(w.sfx);
  muzzle(mx, my);
  return true;
}

function updatePlayerBullets() {
  const cam = G.cam;
  for (const b of G.pb) {
    b.t++;
    if (b.kind === 'F') {
      b.bx += b.vx; b.by += b.vy;
      const th = b.t * 0.3, r = 10;
      const px = -b.dy, py = b.dx;
      const s = Math.sin(th), c = (1 - Math.cos(th)) * 0.6;
      b.x = b.bx + (px * s + b.dx * c) * r;
      b.y = b.by + (py * s + b.dy * c) * r;
      if ((b.t & 3) === 0) G.fx.push({ k: 'p', x: b.x, y: b.y, vx: 0, vy: -0.3, g: 0, life: 8, col: '#ff8a1a', sz: 1 });
    } else {
      b.x += b.vx; b.y += b.vy;
      if (b.kind === 'L') b.len = Math.min(22, b.len + 6);
    }
    const m = 24;
    if (b.x < cam.x - m || b.x > cam.x + W + m || b.y < cam.y - m || b.y > cam.y + H + m) b.dead = true;
  }
  G.pb = G.pb.filter(b => !b.dead);
}
function bulletBox(b) {
  if (b.kind === 'L') {
    const x2 = b.x - b.dx * b.len, y2 = b.y - b.dy * b.len;
    return [Math.min(b.x, x2) - 2, Math.min(b.y, y2) - 2, Math.max(b.x, x2) + 2, Math.max(b.y, y2) + 2];
  }
  const r = b.kind === 'S' ? (b.t < 10 ? 2 : b.t < 22 ? 3 : 4) : b.kind === 'F' ? 4 : 2;
  return [b.x - r, b.y - r, b.x + r, b.y + r];
}
function drawPlayerBullets() {
  for (const b of G.pb) {
    if (b.kind === 'N') drawSpr(SPR.B.pb, b.x, b.y);
    else if (b.kind === 'M') drawSpr(SPR.B.mg, b.x, b.y);
    else if (b.kind === 'S') drawSpr(b.t < 10 ? SPR.B.sp1 : b.t < 22 ? SPR.B.sp2 : SPR.B.sp3, b.x, b.y);
    else if (b.kind === 'F') drawSpr(SPR.B['fire' + ((b.t >> 2) & 1)], b.x, b.y);
    else if (b.kind === 'L') {
      const n = Math.round(b.len);
      for (let i = 0; i <= n; i++) {
        const x = Math.round(b.x - b.dx * i), y = Math.round(b.y - b.dy * i);
        ctx.fillStyle = '#1a6ad8'; ctx.fillRect(x - 2, y - 2, 4, 4);
      }
      for (let i = 0; i <= n; i++) {
        const x = Math.round(b.x - b.dx * i), y = Math.round(b.y - b.dy * i);
        ctx.fillStyle = i < 3 ? '#ffffff' : '#7ae8ff'; ctx.fillRect(x - 1, y - 1, 2, 2);
      }
    }
  }
}

// ============================================================
//  Player commando
// ============================================================
const RUN = 1.45, SWIM = 0.9, JUMP_V = 5.0;

class Player {
  constructor(idx) {
    this.idx = idx; this.pad = PADS[idx]; this.S = SPR.p[idx];
    this.lives = D().lives + (G.konami ? 27 : 0);
    this.score = 0; this.nextLife = 20000;
    this.weapon = 'N'; this.rapid = false;
    this.state = 'alive';
    this.reset(0, 0);
  }
  reset(x, y) {
    Object.assign(this, { x, y, vx: 0, vy: 0, hw: 5, h: 28, facing: 1, onGround: false, inWater: false, diving: false, prone: false,
      jumping: false, aim: 'fwd', airAim: [1, 0], fireCd: 0, anim: 0, deadT: 0, deadRest: false, inv: 0, barrier: 0, dropY: null,
      hp: D().hp, plat: null, hitWall: 0 });
  }
  get alive() { return this.state === 'alive'; }

  update() {
    if (this.state === 'out') { this.outUpdate(); return; }
    if (this.state === 'dead') { this.deadUpdate(); return; }
    const pad = this.pad, lock = G.lockInput;
    let dx = lock ? 0 : (pad.down('right') ? 1 : 0) - (pad.down('left') ? 1 : 0);
    let dy = lock ? 0 : (pad.down('down') ? 1 : 0) - (pad.down('up') ? 1 : 0);
    if (G.autoRun) { dx = 1; dy = 0; }
    if (this.inv > 0) this.inv--;
    if (this.barrier > 0) this.barrier--;
    if (this.fireCd > 0) this.fireCd--;
    this.prone = false; this.diving = false;
    let moving = false;

    if (this.inWater) {
      if (dy > 0) { this.diving = true; this.vx = 0; }
      else { this.vx = dx * SWIM; moving = dx !== 0; }
      if (dx) this.facing = dx;
      this.aim = dy < 0 ? (dx ? 'dup' : 'up') : 'fwd';
    } else if (this.onGround) {
      if (!lock && pad.hit('jump')) {
        if (dy > 0 && this.canDrop()) { this.dropY = this.y; this.y += 1; this.onGround = false; }
        else { this.vy = -JUMP_V; this.jumping = true; this.onGround = false; this.airAim = [this.facing, 0]; Snd.play('jump'); }
      }
      if (dy > 0 && dx === 0 && this.onGround) { this.prone = true; this.vx = 0; this.aim = 'prone'; }
      else { this.vx = dx * RUN; moving = dx !== 0; this.aim = dy < 0 ? (dx ? 'dup' : 'up') : dy > 0 ? 'ddown' : 'fwd'; }
      if (dx) this.facing = dx;
    } else {
      this.vx = dx * RUN; moving = dx !== 0;
      if (dx) this.facing = dx;
      if (this.jumping) this.airAim = (dx || dy) ? [dx, dy] : [this.facing, 0];
      else this.aim = dy < 0 ? (dx ? 'dup' : 'up') : dy > 0 ? 'ddown' : 'fwd';
    }

    // ride moving platforms
    if (this.onGround && this.plat && this.plat.dx !== undefined) { this.x += this.plat.dx; this.y = this.plat.y; }
    this.h = this.prone ? 12 : this.jumping ? 20 : 28;
    const wasWater = this.inWater;
    moveBody(this, { drop: this.dropY !== null ? this.dropY : false, swim: true });
    if (this.dropY !== null && this.y > this.dropY + 6) this.dropY = null;
    if (this.onGround) {
      if (this.jumping && this.landed) { this.jumping = false; }
      this.jumping = false;
      this.inWater = !this.plat && tileAtPx(this.x, this.y + 1) === T_WATER;
    } else this.inWater = false;
    if (this.inWater && !wasWater) { const wl = waterLineAt(this.x); splash(this.x, wl !== null ? wl : this.y - 12); }
    // climb out of water onto a low shore
    if (this.inWater && dx && this.hitWall === dx) {
      const ex = this.x + dx * (this.hw + 2);
      const r = Math.floor((this.y - 2) / TS);
      if (tileAt(Math.floor(ex / TS), r) === T_SOLID && tileAt(Math.floor(ex / TS), r - 1) !== T_SOLID && tileAt(Math.floor(ex / TS), r - 2) !== T_SOLID) {
        this.y = r * TS; this.x += dx * 4; this.inWater = false; this.onGround = true; this.vy = 0;
      }
    }
    // bounds
    if (L.def.scroll === 'h') {
      const lo = G.cam.x + 8, hi = G.cam.x + W - 8;
      if (this.x < lo) this.x = lo; if (this.x > hi) this.x = hi;
      if (this.y > L.ph + 30) this.kill(true);
    } else {
      if (this.y > G.cam.y + H + 30) this.kill(true);
      if (this.y < G.cam.y + 24) { this.y = G.cam.y + 24; if (this.vy < 0) this.vy = 0; }
    }
    if (this.state !== 'alive') return;
    // shooting
    if (!lock && pad.down('fire') && !this.diving) {
      const w = WEAPONS[this.weapon];
      const rate = Math.round(w.rate * (this.rapid ? 0.72 : 1));
      if (this.fireCd <= 0 || (pad.hit('fire') && this.fireCd <= rate - w.tap)) {
        const [mx, my, ddx, ddy] = this.muzzle();
        if (firePlayerWeapon(this, mx, my, ddx, ddy)) this.fireCd = rate;
      }
    }
    if (moving || this.jumping) this.anim++;
  }
  canDrop() {
    if (G.arena && L.def.scroll === 'v') return false;
    if (this.plat) return this.plat.oneway !== false;
    const t = tileAtPx(this.x, this.y + 1);
    if (t !== T_LEDGE) return false;
    return true;
  }
  muzzle() {
    const f = this.facing;
    if (this.jumping) {
      const [ax, ay] = this.airAim, n = Math.hypot(ax, ay) || 1;
      return [this.x + ax / n * 10, this.y - 12 + ay / n * 10, ax, ay];
    }
    if (this.prone) return [this.x + f * 23, this.y - 5, f, 0];
    const aim = this.aim === 'prone' ? 'fwd' : this.aim;
    const m = MUZZLE[aim] || MUZZLE.fwd;
    const d = { fwd: [f, 0], up: [0, -1], dup: [f, -1], ddown: [f, 1] }[aim];
    return [this.x + m[0] * f, this.y + m[1], d[0], d[1]];
  }
  box() {
    if (this.state !== 'alive' || this.diving) return null;
    const x = this.x, y = this.y;
    if (this.inWater) return [x - 5, y - 30, x + 5, y - 13];
    if (this.jumping) return [x - 6, y - 19, x + 6, y - 5];
    if (this.prone) return [x - 12, y - 9, x + 12, y];
    return [x - 5, y - 27, x + 5, y];
  }
  kill(force) {
    if (this.state !== 'alive') return;
    if (G.god && !force) return;
    if (G.god && force) { this.y = G.cam.y + 20; this.vy = 0; return; }
    if (!force && (this.inv > 0 || this.barrier > 0)) return;
    if (!force && this.hp > 1) { this.hp--; this.inv = 110; Snd.play('hit'); flashScreen(0.25, '#ff2a2a'); shake(2); return; }
    this.state = 'dead'; this.deadT = 0; this.deadRest = false;
    this.vx = -this.facing * 1.0; this.vy = -3.6;
    this.lives--; this.weapon = 'N'; this.rapid = false; this.barrier = 0;
    this.jumping = false; this.inWater = false; this.prone = false; this.fell = !!force;
    Snd.play('die');
  }
  deadUpdate() {
    this.deadT++;
    if (!this.deadRest && !this.fell) {
      this.vy = Math.min(this.vy + 0.2, 5); this.x += this.vx;
      const py = this.y; this.y += this.vy;
      if (this.vy > 0) { const land = findLanding(this.x - 4, this.x + 4, py, this.y, false, true); if (land) { this.y = land.y; this.deadRest = true; } }
      if (L.def.scroll === 'h') this.x = clamp(this.x, G.cam.x + 8, G.cam.x + W - 8);
    }
    if (this.deadT > 95) {
      if (this.lives > 0) this.respawn();
      else { this.state = 'out'; checkGameOver(); }
    }
  }
  outUpdate() {
    const mate = G.players.find(p => p !== this && p.state === 'alive');
    if (mate && mate.lives >= 2 && (this.pad.hit('start') || this.pad.hit('jump'))) {
      mate.lives--; this.lives = 1; this.respawn(); Snd.play('oneup');
      popup(this.x, this.y - 40, 'LIFE SHARED', '#ffe070');
    }
  }
  respawn() {
    const [x, y] = findRespawn(this);
    const keep = { lives: this.lives, score: this.score, nextLife: this.nextLife };
    this.reset(x, y);
    Object.assign(this, keep);
    this.state = 'alive'; this.inv = 150; this.jumping = true; this.airAim = [1, 0];
  }
  draw() {
    if (this.state === 'out') return;
    const S = this.S, fl = this.facing < 0;
    if (this.state === 'dead') {
      if (this.fell) return;
      if (this.deadRest) { if (this.deadT < 70 || (this.deadT & 4)) drawSpr(S.dead, this.x, this.y, fl); }
      else drawSpr(S.ball[(this.deadT >> 2) & 3], this.x, this.y, !fl);
      return;
    }
    if (this.inv > 0 && (this.inv & 4)) return;
    if (this.inWater) {
      const wl = waterLineAt(this.x) || this.y - 12;
      if (this.diving) {
        if ((tick >> 3) & 1) { ctx.fillStyle = '#e8f8ff'; ctx.fillRect(Math.round(this.x) - 1, wl - 2, 2, 2); ctx.fillRect(Math.round(this.x) + 3, wl - 4, 1, 1); }
      } else {
        const aim = this.aim === 'dup' ? 'dup' : this.aim === 'up' ? 'up' : 'fwd';
        const spr = aim === 'dup' ? S.run.dup[1] : S.stand[aim][(tick >> 4) & 1];
        drawSprClipped(spr, this.x, this.y, fl, wl + 1);
      }
      ctx.fillStyle = '#e8f8ff';
      const r = 7 + ((tick >> 3) & 1);
      ctx.fillRect(Math.round(this.x - r), wl, 3, 1); ctx.fillRect(Math.round(this.x + r - 3), wl, 3, 1);
    } else if (this.jumping) {
      const i = (this.anim >> 2) & 3;
      drawSpr(S.ball[i], this.x, this.y - 2, fl);
    } else if (this.prone) drawSpr(S.prone, this.x, this.y, fl);
    else if (!this.onGround) drawSpr(S.fall[this.aim] || S.fall.fwd, this.x, this.y, fl);
    else if (this.vx !== 0 || this.hitWall) drawSpr(S.run[this.aim === 'up' ? 'dup' : this.aim][(this.anim / 5 | 0) % 6], this.x, this.y, fl);
    else drawSpr(S.stand[this.aim === 'dup' ? 'up' : this.aim === 'ddown' ? 'fwd' : this.aim][(tick >> 4) & 1], this.x, this.y, fl);
    if (this.barrier > 0 && (this.barrier > 120 || (this.barrier & 4))) {
      const cols = ['#7ae8ff', '#ffffff', '#5ab0ff', '#b8f4ff'];
      const cy = this.y - (this.prone ? 6 : 14), rx = this.prone ? 16 : 11, ry = this.prone ? 9 : 18;
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2 + tick * 0.12;
        ctx.fillStyle = cols[(i + (tick >> 2)) & 3];
        ctx.fillRect(Math.round(this.x + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 2, 2);
      }
    }
  }
}

function findRespawn(p) {
  const cam = G.cam;
  const mate = G.players.find(q => q !== p && q.state === 'alive');
  if (L.def.scroll === 'h') {
    const start = mate ? clamp(mate.x - 40, cam.x + 40, cam.x + W - 80) : cam.x + 56;
    for (let k = 0; k < 40; k++) {
      for (const dir of [1, -1]) {
        const x = start + dir * k * 8;
        if (x < cam.x + 32 || x > cam.x + W - 40) continue;
        const s = surfacesInColumn(x, cam.y + 40, cam.y + H - 4);
        const hasWater = L.waterTop[Math.floor(x / TS)] >= 0;
        if (s.length || hasWater) return [x, cam.y + 6];
      }
    }
    return [cam.x + 60, cam.y + 6];
  } else {
    let best = null;
    for (let x = 40; x < W - 40; x += 8) {
      const s = surfacesInColumn(x, cam.y + 60, cam.y + H - 30);
      if (s.length) { const d = Math.abs(x - (mate ? mate.x : W / 2)); if (!best || d < best[2]) best = [x, s[0], d]; }
    }
    if (best) return [best[0], Math.max(cam.y + 28, best[1] - 40)];
    return [W / 2, cam.y + 30];
  }
}

function addScore(p, pts) {
  if (!p || !(p instanceof Player)) return;
  p.score += pts;
  while (p.score >= p.nextLife) {
    p.lives++; p.nextLife += p.nextLife === 20000 ? 50000 : 60000;
    Snd.play('oneup'); popup(p.x, p.y - 44, '1UP', '#7aff7a');
  }
  if (p.score > G.hi) G.hi = p.score;
}
function nearestPlayer(x, y) {
  let best = null, bd = 1e9;
  for (const p of G.players) {
    if (p.state !== 'alive') continue;
    const d = Math.abs(p.x - x) + Math.abs(p.y - y) * 0.7;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function applyItem(p, it) {
  const L_ = it.letter;
  if ('MSLF'.includes(L_)) {
    if (p.weapon === L_) addScore(p, 1000);
    p.weapon = L_;
    popup(p.x, p.y - 40, WEAPONS[L_].name, ITEM_COLORS[L_] === '#e8301e' ? '#ff8a6a' : shade(ITEM_COLORS[L_], 1.35));
  } else if (L_ === 'R') { p.rapid = true; popup(p.x, p.y - 40, 'RAPID FIRE', '#d0a0ff'); }
  else if (L_ === 'B') { p.barrier = 660; popup(p.x, p.y - 40, 'BARRIER', '#7aff9a'); }
  Snd.play('power');
}

// ============================================================
//  Enemies, hazards, pickups, platforms
// ============================================================
function onScreen(x, y, m = 0) { const c = G.cam; return x > c.x - m && x < c.x + W + m && y > c.y - m && y < c.y + H + m; }
function behindCamera(e, m = 90) {
  const c = G.cam;
  return L.def.scroll === 'h' ? e.x < c.x - m : e.y > c.y + H + m;
}
function shootAt(x, y, tx, ty, speed = 1.9, kind = 'eb', extra) {
  const dx = tx - x, dy = ty - y, n = Math.hypot(dx, dy) || 1, s = speed * D().bspeed;
  G.eb.push(Object.assign({ x, y, vx: dx / n * s, vy: dy / n * s, kind, t: 0 }, extra || {}));
  Snd.play('eshot');
}
function lob(x, y, tx, ty, kind = 'gren', t = 60, g = 0.14) {
  // ballistic throw reaching (tx, ty) after ~t frames
  const vx = clamp((tx - x) / t, -2.6, 2.6);
  const vy = clamp((ty - y - 0.5 * g * t * t) / t, -5.2, -1.5);
  G.eb.push({ x, y, vx, vy, kind, g, t: 0 });
}

class Enemy {
  constructor(x, y) {
    this.x = x; this.y = y; this.hp = 1; this.maxHp = 1; this.score = 100; this.dead = false; this.flash = 0; this.t = 0;
    this.contact = true; this.metal = false; this.static = false;
  }
  get hittable() { return this._hittable !== false; }
  set hittable(v) { this._hittable = v; }
  box() { return null; }
  canHit() { return true; }
  hurt(dmg, by) {
    if (!this.canHit()) { Snd.play('metal'); return true; }
    this.hp -= dmg; this.flash = 3;
    if (this.hp <= 0) { this.hp = 0; this.die(by); }
    else Snd.play(this.metal ? 'metal' : 'hit');
    return true;
  }
  die(by) {
    this.dead = true; addScore(by, this.score);
    if (this.score >= 500) popup(this.x, this.y - 24, String(this.score), '#ffe070');
  }
  update() { this.t++; if (this.flash > 0) this.flash--; }
  draw() {}
}

// ---------------- soldiers ----------------
class Runner extends Enemy {
  constructor(x, y, dir, kind = 'soldier') {
    super(x, y); this.S = SPR[kind]; this.facing = dir; this.vx = 0; this.vy = 0; this.hw = 5; this.h = 26;
    this.speed = 1.25 + rand(-0.05, 0.1); this.shootT = chance(0.25 * D().fire) ? randi(45, 110) : -1; this.edgeTx = -999; this.pause = 0;
  }
  update() {
    super.update();
    if (this.pause > 0) { this.pause--; this.vx = 0; } else this.vx = this.facing * this.speed;
    if (this.onGround && this.pause <= 0 && !groundAhead(this.x, this.y, this.facing, 7)) {
      const tx = Math.floor((this.x + this.facing * 7) / TS);
      if (tx !== this.edgeTx) { this.edgeTx = tx; if (chance(0.55)) { this.vy = -4.3; this.onGround = false; } }
    }
    moveBody(this);
    if (this.hitWall && this.onGround) { if (chance(0.6)) this.vy = -4.7; else this.facing = -this.facing; }
    if (this.shootT > 0 && --this.shootT === 0 && this.onGround && onScreen(this.x, this.y, -10)) {
      const p = nearestPlayer(this.x, this.y);
      if (p) { this.facing = p.x < this.x ? -1 : 1; this.pause = 20; shootAt(this.x + this.facing * 14, this.y - 20, p.x, p.y - 14, 1.9); muzzle(this.x + this.facing * 15, this.y - 20); }
    }
    const tw = tileAtPx(this.x, this.y - 3);
    if (tw === T_WSURF || tw === T_WATER) { const wl = waterLineAt(this.x); splash(this.x, wl !== null ? wl : this.y); this.dead = true; }
    if (this.y > L.ph + 20 || !onScreen(this.x, this.y, 90)) this.dead = true;
  }
  box() { return [this.x - 5, this.y - 26, this.x + 5, this.y]; }
  draw() {
    const S = this.S;
    const spr = !this.onGround ? S.fall.fwd : this.pause > 0 ? S.stand.fwd[0] : S.run.fwd[(this.t / 5 | 0) % 6];
    drawSpr(spr, this.x, this.y, this.facing < 0, this.flash > 0);
  }
  die(by) { super.die(by); corpse(this.S.hurt, this.x, this.y, -this.facing); Snd.play('kill'); }
}

class Rifleman extends Enemy {
  constructor(x, y, kind = 'soldier') {
    super(x, y); this.S = SPR[kind]; this.score = 200; this.facing = -1; this.cool = randi(40, 90); this.aim = 'fwd'; this.burst = 0;
    this.hw = 5; this.h = 26; this.vx = 0; this.vy = 0; this.static = true;
  }
  track() {
    const p = nearestPlayer(this.x, this.y);
    if (!p) return null;
    this.facing = p.x < this.x ? -1 : 1;
    const a = Math.atan2((p.y - 14) - (this.y - 20), Math.abs(p.x - this.x));
    this.aim = a < -1.15 ? 'up' : a < -0.35 ? 'dup' : a > 0.4 ? 'ddown' : 'fwd';
    return p;
  }
  update() {
    super.update();
    if (!this.fixed) moveBody(this);
    const p = this.track();
    if (p && onScreen(this.x, this.y, -6)) {
      if (--this.cool <= 0) { this.burst = G.diff === 2 ? 3 : 2; this.cool = randi(95, 150) / D().fire; }
      if (this.burst > 0 && this.t % 10 === 0) { this.burst--; this.fire(p); }
    }
  }
  fire(p) {
    const m = MUZZLE[this.aim], mx = this.x + m[0] * this.facing, my = this.y + m[1];
    const base = { fwd: [this.facing, 0], up: [0, -1], dup: [this.facing, -1], ddown: [this.facing, 1] }[this.aim];
    let ang = Math.atan2(base[1], base[0]);
    let d = Math.atan2(p.y - 14 - my, p.x - mx) - ang;
    while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    ang += clamp(d, -0.42, 0.42);
    const s = 1.9 * D().bspeed;
    G.eb.push({ x: mx, y: my, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, kind: 'eb', t: 0 });
    muzzle(mx, my); Snd.play('eshot');
  }
  box() { return [this.x - 5, this.y - 26, this.x + 5, this.y]; }
  draw() { drawSpr(this.S.stand[this.aim][0], this.x, this.y, this.facing < 0, this.flash > 0); }
  die(by) { super.die(by); corpse(this.S.hurt, this.x, this.y, -this.facing); Snd.play('kill'); }
}

class BushSniper extends Rifleman {
  constructor(x, y) { super(x, y); this.score = 300; this.phase = 0; this.pt = randi(40, 100); this.rise = 0; this.bush = pick(SPR.bush); }
  update() {
    this.t++; if (this.flash > 0) this.flash--;
    const p = this.track();
    if (--this.pt <= 0) { this.phase = (this.phase + 1) % 4; this.pt = [randi(70, 120), 12, 80, 12][this.phase]; }
    this.rise = [0, 1 - this.pt / 12, 1, this.pt / 12][this.phase];
    if (this.phase === 2 && p && this.pt % 34 === 20 && onScreen(this.x, this.y, -6)) this.fire(p);
  }
  canHit() { return this.rise > 0.55; }
  box() { return this.rise > 0.55 ? [this.x - 5, this.y - 24, this.x + 5, this.y - 6] : null; }
  draw() {
    if (this.rise > 0) drawSprClipped(this.S.stand[this.aim][0], this.x, this.y + Math.round((1 - this.rise) * 20), this.facing < 0, this.y - 5, this.flash > 0);
    drawSpr(this.bush, this.x, this.y + 1);
  }
}

class Grenadier extends Rifleman {
  constructor(x, y) { super(x, y, 'trooper'); this.hp = 2; this.score = 300; this.cool = randi(50, 110); this.throwT = 0; }
  update() {
    this.t++; if (this.flash > 0) this.flash--;
    moveBody(this);
    const p = this.track();
    if (this.throwT > 0) this.throwT--;
    if (p && onScreen(this.x, this.y, -6) && --this.cool <= 0) {
      this.throwT = 16; this.cool = randi(110, 160) / D().fire;
      lob(this.x - this.facing * 4, this.y - 30, p.x, p.y - 6, 'gren', 56, 0.14);
    }
  }
  draw() {
    const spr = this.throwT > 8 ? this.S.throw : this.S.stand.fwd[0];
    drawSpr(spr, this.x, this.y, this.facing < 0, this.flash > 0);
  }
}

// ---------------- emplacements ----------------
class Turret extends Enemy {
  constructor(x, y, theme) {
    super(x, y); this.hp = this.maxHp = 9; this.score = 500; this.state = 'closed'; this.dir = 8; this.open = 0; this.cool = 50;
    this.spr = SPR.turret[theme === 'base' ? 'base' : 'jungle']; this.metal = true; this.contact = false; this.static = true;
  }
  get hittable() { return this.state === 'open'; }
  update() {
    super.update();
    if (this.state === 'wreck') return;
    const p = nearestPlayer(this.x, this.y);
    if (this.state === 'closed') {
      if (p && Math.abs(p.x - this.x) < 240 && Math.abs(p.y - this.y) < 220 && onScreen(this.x, this.y, -10)) { this.state = 'opening'; this.open = 0; }
    } else if (this.state === 'opening') {
      if (++this.open >= 16) this.state = 'open';
    } else if (p) {
      const want = dir16(p.x - this.x, (p.y - 14) - this.y);
      if (this.t % 9 === 0 && want !== this.dir) { const d = (want - this.dir + 16) % 16; this.dir = (this.dir + (d < 8 ? 1 : 15)) % 16; }
      if (--this.cool <= 0 && want === this.dir && onScreen(this.x, this.y, -4)) {
        const [vx, vy] = vec16(this.dir), s = 1.75 * D().bspeed;
        G.eb.push({ x: this.x + vx * 15, y: this.y + vy * 15, vx: vx * s, vy: vy * s, kind: 'eb', t: 0 });
        muzzle(this.x + vx * 16, this.y + vy * 16); Snd.play('eshot');
        this.cool = randi(62, 95) / D().fire;
      }
    }
  }
  box() { return this.state === 'wreck' || this.state === 'closed' ? null : [this.x - 12, this.y - 12, this.x + 12, this.y + 12]; }
  die(by) { addScore(by, this.score); popup(this.x, this.y - 18, '500', '#ffe070'); this.state = 'wreck'; explode(this.x, this.y, 'm'); }
  draw() {
    if (this.state === 'wreck') drawSpr(this.spr.wreck, this.x, this.y);
    else if (this.state === 'closed' || (this.state === 'opening' && this.open < 8)) drawSpr(this.spr.closed, this.x, this.y);
    else drawSpr(this.spr.open[this.dir], this.x, this.y, false, this.flash > 0);
  }
}

class Cannon extends Enemy {
  constructor(x, y) {
    super(x, y); this.hp = this.maxHp = 12; this.score = 500; this.metal = true; this.rise = 0; this.state = 'hidden'; this.cool = 40;
    this.frame = 0; this.facing = -1; this.contact = false; this.static = true;
  }
  get hittable() { return this.state === 'active'; }
  update() {
    super.update();
    if (this.state === 'wreck') return;
    const p = nearestPlayer(this.x, this.y);
    if (this.state === 'hidden') { if (p && Math.abs(p.x - this.x) < 220 && onScreen(this.x, this.y, -16)) { this.state = 'rising'; Snd.play('crumble'); } }
    else if (this.state === 'rising') { this.rise += 1 / 36; if (this.rise >= 1) { this.rise = 1; this.state = 'active'; this.cool = 70; } if (this.t % 6 === 0) debris(this.x + rand(-12, 12), this.y, 1, ['#6e5a48', '#4a3c30']); }
    else if (p) {
      this.facing = p.x < this.x ? -1 : 1;
      const a = Math.atan2((p.y - 14) - (this.y - 16), Math.abs(p.x - this.x));
      this.frame = a > -0.3 ? 0 : a > -0.85 ? 1 : 2;
      if (--this.cool <= 0 && onScreen(this.x, this.y, -4)) {
        const ang = [0, -Math.PI / 6, -Math.PI / 3][this.frame];
        const vx = Math.cos(ang) * this.facing, vy = Math.sin(ang), s = 1.6 * D().bspeed;
        G.eb.push({ x: this.x + vx * 18, y: this.y - 14 + vy * 18, vx: vx * s, vy: vy * s, kind: 'orb', t: 0 });
        muzzle(this.x + vx * 19, this.y - 14 + vy * 19); Snd.play('eshot');
        this.cool = randi(85, 115) / D().fire;
      }
    }
  }
  box() { return this.state === 'active' ? [this.x - 13, this.y - 24, this.x + 13, this.y] : null; }
  die(by) { addScore(by, this.score); popup(this.x, this.y - 30, '500', '#ffe070'); this.state = 'wreck'; this.frame = 3; explode(this.x, this.y - 12, 'm'); }
  draw() {
    if (this.state === 'hidden') return;
    const off = Math.round((1 - this.rise) * 28);
    drawSprClipped(SPR.cannon[this.frame], this.x, this.y + off, this.facing > 0, this.y, this.flash > 0);
  }
}

class FireJet extends Enemy {
  constructor(x, y, dir) { super(x, y); this.dir = dir; this.hittable = false; this.phase = 0; this.pt = randi(30, 120); this.static = true; }
  update() {
    super.update();
    if (--this.pt <= 0) { this.phase = (this.phase + 1) % 3; this.pt = [110, 34, 64][this.phase]; if (this.phase === 2) Snd.play('fire'); }
    if (this.phase === 1 && this.t % 5 === 0) sparks(this.x, this.y + this.dir * 4, 2, '#ffb040');
  }
  hbox() {
    if (this.phase !== 2) return null;
    const len = Math.min(56, (64 - this.pt) * 6);
    return this.dir < 0 ? [this.x - 5, this.y - len, this.x + 5, this.y] : [this.x - 5, this.y, this.x + 5, this.y + len];
  }
  draw() {
    const x = Math.round(this.x), y = Math.round(this.y);
    ctx.fillStyle = '#1a1c22'; ctx.fillRect(x - 7, this.dir < 0 ? y - 4 : y, 14, 4);
    ctx.fillStyle = '#6a7282'; ctx.fillRect(x - 6, this.dir < 0 ? y - 3 : y + 1, 12, 2);
    ctx.fillStyle = this.phase === 1 && (tick & 4) ? '#ff5a3a' : '#2a2e38'; ctx.fillRect(x - 2, this.dir < 0 ? y - 4 : y + 3, 4, 1);
    const hb = this.hbox();
    if (hb) {
      const cols = ['#fff6c0', '#ffe45a', '#ff9a2a', '#e8442a'];
      const top = hb[1], bot = hb[3];
      for (let yy = top; yy < bot; yy += 2) {
        const d = this.dir < 0 ? (bot - yy) : (yy - top), len = bot - top;
        const w = 3 + Math.round(Math.sin((yy + tick * 3) * 0.4) * 1.5 + (d / len) * 4);
        const ci = Math.min(3, Math.floor(d / len * 4 + ((yy + tick) & 1) * 0.5));
        ctx.fillStyle = cols[ci]; ctx.fillRect(x - w, yy, w * 2, 2);
      }
    }
  }
}
